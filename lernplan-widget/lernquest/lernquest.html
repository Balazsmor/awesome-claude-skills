<title>Lernquest Berichtsheft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style id="app-style">
/* ===========================================================================
   Lernquest · Berichtsheft
   Blaupause + Stempel. Dunkel ist die Grundfassung, hell die Umkehrung.
   Farben stehen ausschliesslich in Tokens, damit beide Fassungen stimmen.
   =========================================================================== */

:root {
  --bg:#0E1621; --panel:#16202D; --panel-2:#1D2937; --sunk:#101A25;
  --ink:#E9EFF6; --ink-2:#A9BACD; --ink-3:#8195AB;
  --rule:rgba(233,239,246,0.11); --rule-2:rgba(233,239,246,0.06);
  --amber:#FFB03A; --amber-soft:rgba(255,176,58,0.15);
  --mint:#45D6A8; --mint-soft:rgba(69,214,168,0.15);
  --coral:#FF6F5E; --coral-soft:rgba(255,111,94,0.14);
  --blue:#5AA9E6; --blue-soft:rgba(90,169,230,0.14);
  --heat-0:rgba(233,239,246,0.05);
  --heat-1:#1F3F5E; --heat-2:#2C5C86; --heat-3:#3B7CB0; --heat-4:#5AA9E6;
  --shadow:0 18px 40px rgba(0,0,0,0.34);
  --grid:rgba(90,169,230,0.055);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#E4EAF1; --panel:#F5F8FB; --panel-2:#E8EEF5; --sunk:#DDE5EE;
    --ink:#111C29; --ink-2:#3C4F65; --ink-3:#52657C;
    --rule:rgba(17,28,41,0.14); --rule-2:rgba(17,28,41,0.07);
    --amber:#8F5B00; --amber-soft:rgba(143,91,0,0.13);
    --mint:#0E6B50; --mint-soft:rgba(14,107,80,0.13);
    --coral:#B93325; --coral-soft:rgba(185,51,37,0.12);
    --blue:#215F92; --blue-soft:rgba(33,95,146,0.12);
    --heat-0:rgba(17,28,41,0.06);
    --heat-1:#B9CFE2; --heat-2:#8DB4D2; --heat-3:#5B90BC; --heat-4:#2E6FA3;
    --shadow:0 14px 32px rgba(20,40,60,0.13);
    --grid:rgba(33,95,146,0.07);
  }
}
:root[data-theme="light"] {
  --bg:#E4EAF1; --panel:#F5F8FB; --panel-2:#E8EEF5; --sunk:#DDE5EE;
  --ink:#111C29; --ink-2:#3C4F65; --ink-3:#52657C;
  --rule:rgba(17,28,41,0.14); --rule-2:rgba(17,28,41,0.07);
  --amber:#8F5B00; --amber-soft:rgba(143,91,0,0.13);
  --mint:#0E6B50; --mint-soft:rgba(14,107,80,0.13);
  --coral:#B93325; --coral-soft:rgba(185,51,37,0.12);
  --blue:#215F92; --blue-soft:rgba(33,95,146,0.12);
  --heat-0:rgba(17,28,41,0.06);
  --heat-1:#B9CFE2; --heat-2:#8DB4D2; --heat-3:#5B90BC; --heat-4:#2E6FA3;
  --shadow:0 14px 32px rgba(20,40,60,0.13);
  --grid:rgba(33,95,146,0.07);
}

* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:1080px; margin:0 auto; padding:28px 20px 72px; }

h1,h2,h3 { font-family:"Chakra Petch","IBM Plex Sans",sans-serif; margin:0;
           text-wrap:balance; letter-spacing:-0.01em; }
.mono { font-family:"IBM Plex Mono",ui-monospace,monospace;
        font-variant-numeric:tabular-nums; }
.eyebrow { font-family:"IBM Plex Mono",monospace; font-size:10.5px;
           letter-spacing:0.18em; text-transform:uppercase; color:var(--ink-3); }

/* ---- Kopf ---------------------------------------------------------------- */
.top { display:flex; align-items:flex-end; justify-content:space-between;
       gap:16px; flex-wrap:wrap; margin-bottom:22px; }
.top h1 { font-size:clamp(26px,4vw,38px); font-weight:700; line-height:1.05; }
.top .sub { color:var(--ink-2); font-size:13.5px; margin-top:4px; }
.tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
/* Nur für Screenreader — trägt Rückmeldungen, die sonst bloss Farbe wären. */
.sr { position:absolute; width:1px; height:1px; margin:-1px; padding:0;
      overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
button { font:inherit; color:inherit; cursor:pointer; }
.btn { background:var(--panel); border:1px solid var(--rule); border-radius:9px;
       padding:0 13px; min-height:38px; display:inline-flex; align-items:center;
       gap:7px; font-size:13px; transition:background 120ms ease, border-color 120ms ease; }
.btn:hover { background:var(--panel-2); border-color:var(--ink-3); }
.btn:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
.btn.ghost { background:transparent; }
.btn.prim { border-color:var(--amber); color:var(--amber); background:var(--amber-soft); }
.btn.prim:hover { border-color:var(--amber); background:var(--amber-soft); filter:brightness(1.12); }
.btn.back { border-color:var(--amber); color:var(--amber); }
.btn.small { min-height:32px; padding:0 11px; font-size:12.5px; }

/* ---- Meldungen ------------------------------------------------------------
   Drei schmale Bänder über dem Stapel: der Wecker des Fokus-Timers, ein
   Aufstieg und das Rückgängig. Alle drei verschwinden von allein.          */
.wecker, .aufstieg, .undobar {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  margin-top:14px; padding:12px 16px; border-radius:12px;
  border:1px solid var(--rule); font-size:14px; }
.wecker { background:var(--coral-soft); border-color:var(--coral); }
.wecker .ic, .aufstieg .ic { flex:none; display:grid; place-items:center; }
.wecker .ic { color:var(--coral); }
.aufstieg { background:var(--amber-soft); border-color:var(--amber); }
.aufstieg .ic { color:var(--amber); }
.aufstieg b { font-family:"Chakra Petch",sans-serif; }
.undobar { background:var(--panel-2); justify-content:space-between; }
.undobar span { color:var(--ink-2); font-size:13px; }
.wecker .btn, .undobar .btn { margin-left:auto; }

/* ---- Karten -------------------------------------------------------------- */
.card { background:var(--panel); border:1px solid var(--rule); border-radius:14px;
        box-shadow:var(--shadow); padding:20px 22px; }
.stack { display:flex; flex-direction:column; gap:18px; }
.card h2 { font-size:17px; font-weight:600; }
.card-head { display:flex; align-items:baseline; justify-content:space-between;
             gap:12px; flex-wrap:wrap; margin-bottom:14px; }

/* ---- Instrumentenleiste -------------------------------------------------- */
.gauges { display:grid; grid-template-columns:repeat(auto-fit,minmax(212px,1fr));
          gap:1px; background:var(--rule-2); border:1px solid var(--rule);
          border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
.gauge { background:var(--panel); padding:16px 18px; min-height:104px;
         display:flex; flex-direction:column; gap:7px; }
.gauge .val { font-family:"Chakra Petch",sans-serif; font-size:30px; font-weight:700;
              line-height:1; font-variant-numeric:tabular-nums; }
.gauge .val small { font-size:14px; font-weight:600; color:var(--ink-3);
                    margin-left:3px; }
.gauge .cap { font-size:12px; color:var(--ink-2); }
.gauge.amber .val { color:var(--amber); }
.gauge.mint .val { color:var(--mint); }
.gauge.coral .val { color:var(--coral); }

.bar { height:7px; border-radius:4px; background:var(--sunk); overflow:hidden;
       border:1px solid var(--rule-2); }
.bar > i { display:block; height:100%; border-radius:4px; background:var(--amber);
           transition:width 420ms cubic-bezier(.22,.9,.3,1); }
.bar.mint > i { background:var(--mint); }
.bar.coral > i { background:var(--coral); }
.bar.blue > i { background:var(--blue); }

/* ---- Tagesquests --------------------------------------------------------- */
.chip { display:inline-flex; align-items:center; gap:6px; min-height:26px;
        padding:0 10px; border-radius:999px; font-size:11.5px; font-weight:500;
        border:1px solid var(--rule); color:var(--ink-2); background:var(--panel-2); }
.chip.hot { color:var(--coral); border-color:var(--coral); background:var(--coral-soft); }
.chip.rest { color:var(--blue); border-color:var(--blue); background:var(--blue-soft); }
.chip.free { color:var(--amber); border-color:var(--amber); background:var(--amber-soft); }

.focus { display:flex; gap:11px; align-items:baseline; flex-wrap:wrap;
         margin:14px 0 2px; padding:10px 13px; border-radius:10px;
         background:var(--blue-soft); border:1px solid var(--rule);
         font-size:12.5px; color:var(--ink-2); line-height:1.45; }
.focus .eyebrow { color:var(--blue); flex:none; }

/* Was gerade dran ist — eine Zeile, kein Kasten. */
.jetztzeile { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
              margin:14px 0 2px; padding:9px 13px; border-radius:10px;
              background:var(--amber-soft); border:1px solid var(--rule); }
.jetztzeile .eyebrow { color:var(--amber); flex:none; }
.jetztzeile .jn { font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:15px; }
.jetztzeile .jnext { font-size:12.5px; color:var(--ink-2); margin-left:auto; }

.quests { list-style:none; margin:0; padding:0;
          display:flex; flex-direction:column; }
.quest { display:flex; align-items:center; gap:13px; padding:11px 12px;
         border-bottom:1px dashed var(--rule-2); position:relative; }
.quest:last-child { border-bottom:0; }
.quest.fix { opacity:0.58; }
.quest .time { width:52px; flex:none; font-size:12.5px; color:var(--ink-2); }
.quest .body { flex:1; min-width:0; }
.quest .nm { display:block; font-weight:500; line-height:1.3; }
.quest .sb { display:block; font-size:12px; color:var(--ink-3); margin-top:2px; }
/* Die ausführliche Anleitung — verschwindet, sobald der Block abgestempelt ist. */
.quest .dtl { display:block; font-size:12px; color:var(--ink-2); margin-top:5px;
              line-height:1.45; max-width:62ch; padding-left:9px;
              border-left:2px solid var(--rule); }
.quest .xp { flex:none; font-size:12.5px; color:var(--ink-3); width:64px;
             text-align:right; }
.quest.done .nm { color:var(--ink-3); text-decoration:line-through;
                  text-decoration-thickness:1px; }
.quest.done .xp { color:var(--mint); }
.quest.kern .nm::after { content:"KERN"; font-family:"IBM Plex Mono",monospace;
  font-size:9px; letter-spacing:0.12em; color:var(--amber); border:1px solid var(--amber);
  border-radius:4px; padding:1px 4px; margin-left:8px; vertical-align:2px; }

/* Stempelfeld statt Häkchen — das Berichtsheft wird abgestempelt */
.stampbox { flex:none; width:30px; height:30px; border-radius:7px;
            border:1.5px solid var(--rule); background:var(--sunk);
            display:grid; place-items:center; padding:0; transition:
            background 140ms ease, border-color 140ms ease, transform 140ms ease; }
.stampbox svg { width:16px; height:16px; opacity:0; transform:scale(.6);
                transition:opacity 140ms ease, transform 180ms cubic-bezier(.2,1.4,.4,1); }
.quest.done .stampbox { background:var(--mint-soft); border-color:var(--mint); }
.quest.done .stampbox svg { opacity:1; transform:scale(1); }
.stampbox:hover { border-color:var(--ink-3); }
.stampbox:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
.stampbox[disabled] { cursor:default; opacity:.4; }

/* Fokus-Timer je Block: unauffällig, bis er läuft. */
.tbtn { flex:none; width:30px; height:30px; border-radius:7px; background:transparent;
        border:1px solid var(--rule-2); color:var(--ink-3); display:grid;
        place-items:center; font-size:11px; padding:0; }
.tbtn:hover { color:var(--amber); border-color:var(--amber); }
.tbtn:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
.tbtn.leer { border-color:transparent; cursor:default; }
.tbtn.stop { color:var(--coral); border-color:var(--coral); }
.tlauf { flex:none; min-width:52px; text-align:right; font-size:14px; font-weight:600;
         color:var(--amber); font-variant-numeric:tabular-nums; }
.quest.jetzt { background:var(--amber-soft); border-radius:8px; }
.quest.fix.jetzt { opacity:1; }
.quest.fix.jetzt .nm { color:var(--ink-2); }
.quest.jetzt .time { color:var(--amber); font-weight:600; }
.quest.laeuft { box-shadow:inset 3px 0 0 var(--amber); }

/* Tagesnotiz und Timerleiste unter dem Tagesplan. */
.tagnotiz { display:flex; align-items:center; gap:11px; margin-top:14px;
            padding-top:13px; border-top:1px solid var(--rule-2); }
.tagnotiz .eyebrow { flex:none; }
.tagnotiz input { flex:1; min-width:0; font:inherit; font-size:13.5px; min-height:38px;
                  background:var(--sunk); color:var(--ink); border:1px solid var(--rule);
                  border-radius:9px; padding:0 12px; }
.tagnotiz input:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
.tfremd { display:flex; align-items:center; gap:11px; flex-wrap:wrap; margin-top:11px;
          padding:10px 13px; border-radius:10px; background:var(--panel-2);
          border:1px solid var(--rule-2); }
.tfremd .eyebrow { flex:none; }
.tfremd .note { flex:1; min-width:120px; }
.tfremd .btn { margin-left:auto; }

/* Der Stempel selbst */
.stamp { display:inline-flex; align-items:center; justify-content:center;
         font-family:"Chakra Petch",sans-serif; font-weight:700; font-size:13px;
         letter-spacing:0.16em; text-transform:uppercase; padding:7px 14px;
         border:2.5px solid currentColor; border-radius:6px; transform:rotate(-4deg);
         opacity:.92; }
.stamp.saved { color:var(--amber); box-shadow:inset 0 0 0 1px var(--amber-soft); }
.stamp.done  { color:var(--mint); box-shadow:inset 0 0 0 1px var(--mint-soft); }
.stamp.rest  { color:var(--blue); }

.float { position:absolute; right:74px; top:8px; font-family:"IBM Plex Mono",monospace;
         font-size:13px; font-weight:600; color:var(--mint); pointer-events:none;
         animation:rise 900ms ease-out forwards; }
@keyframes rise { from { opacity:0; transform:translateY(6px); }
                  30% { opacity:1; } to { opacity:0; transform:translateY(-16px); } }

/* ---- Woche --------------------------------------------------------------- */
.week { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.day { background:var(--panel-2); border:1px solid var(--rule-2); border-radius:10px;
       padding:10px 6px; text-align:center; min-height:96px; display:flex;
       flex-direction:column; align-items:center; justify-content:flex-start; gap:5px;
       width:100%; font:inherit; color:inherit; cursor:pointer;
       transition:border-color 120ms ease, background 120ms ease; }
.day:hover:not([disabled]) { border-color:var(--ink-3); background:var(--panel); }
.day:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
.day[disabled] { cursor:default; opacity:.4; }
/* Ausgewählt ist der betrachtete Tag, nicht zwingend heute. */
.day.sel { border-color:var(--amber); background:var(--amber-soft); }
.day.sel .dt { color:var(--amber); }
.day .qt { font-size:11px; color:var(--ink-3); }
.day .wd { font-family:"IBM Plex Mono",monospace; font-size:10.5px;
           letter-spacing:0.1em; color:var(--ink-3); }
.day .dt { font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:15px; }
.day.today { border-color:var(--amber); box-shadow:0 0 0 1px var(--amber-soft); }
.day.off { opacity:.55; }
.day .seal { width:26px; height:26px; border-radius:50%; border:2px solid var(--rule);
             display:grid; place-items:center; margin-top:auto; }
.day .seal.on { border-color:var(--mint); background:var(--mint-soft); }
.day .seal.part { border-color:var(--blue); }
.day .seal svg { width:13px; height:13px; }

.wfuss { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px;
         padding-top:13px; border-top:1px solid var(--rule-2); }
.wf { display:flex; flex-direction:column; gap:5px; min-width:0; }
.wf.themen { flex:1 1 260px; }
.wf.ziel { flex:0 0 auto; }
.wf input { font:inherit; font-size:13.5px; min-height:38px; background:var(--sunk);
            color:var(--ink); border:1px solid var(--rule); border-radius:9px;
            padding:0 12px; width:100%; }
.wf.ziel input { width:82px; text-align:center; font-family:"IBM Plex Mono",monospace; }
.wf input:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
.wf .zeile { display:flex; align-items:center; gap:8px; }
.wf .einheit { font-size:12.5px; color:var(--ink-3); }

/* ---- Attribute ----------------------------------------------------------- */
.attrs { display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:13px; }
.attr { background:var(--panel-2); border:1px solid var(--rule-2); border-radius:11px;
        padding:13px 14px; display:flex; flex-direction:column; gap:8px; }
.attr .ah { display:flex; align-items:center; gap:9px; }
.attr .ic { width:28px; height:28px; flex:none; border-radius:8px; display:grid;
            place-items:center; border:1px solid var(--rule); color:var(--blue); }
.attr .an { font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:15px; }
.attr .alv { margin-left:auto; font-size:15px; font-weight:600; color:var(--amber);
             min-width:24px; text-align:right; }
.attr .ad { font-size:12px; color:var(--ink-3); line-height:1.4; }
.attr .ax { font-size:11px; color:var(--ink-3); }
.attr .ax.next { margin-top:-4px; color:var(--ink-2); }
.attr .agn { font-size:11.5px; color:var(--mint); }
.attr .agn.warn { color:var(--coral); }
.atag { display:inline-block; margin-top:4px; font-size:9.5px; letter-spacing:0.13em;
        text-transform:uppercase; color:var(--blue); border:1px solid var(--rule);
        border-radius:4px; padding:1px 6px; }

/* ---- Noten ----------------------------------------------------------------
   Eingabe, Liste, Schnitt je Fach, Prognose. Alles in einer Karte, damit der
   Blick vom Eintragen bis zur Konsequenz nicht springen muss.               */
.gform { display:grid; gap:10px; margin-bottom:4px;
         grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); align-items:end; }
.gf { display:flex; flex-direction:column; gap:5px; min-width:0; }
.gf > span { font-family:"IBM Plex Mono",monospace; font-size:10.5px;
             letter-spacing:0.11em; text-transform:uppercase; color:var(--ink-3); }
.gf input, .gf select { font:inherit; font-size:13.5px; width:100%; min-height:38px;
             background:var(--sunk); color:var(--ink); border:1px solid var(--rule);
             border-radius:9px; padding:0 10px; }
.gf input:focus-visible, .gf select:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
.gf.f-fach { grid-column:span 2; }
.gf.f-was { grid-column:span 2; }
@media (min-width:900px) {
  .gform { grid-template-columns:1.6fr 2.2fr .8fr .8fr 1.2fr 1.3fr auto; }
  .gf.f-fach, .gf.f-was { grid-column:auto; }
}
.f-b { justify-self:stretch; justify-content:center; min-height:38px; }
.gtip { margin:4px 0 0; line-height:1.45; }

.glist { list-style:none; margin:16px 0 0; padding:0; border-top:1px solid var(--rule-2); }
.gitem { display:flex; align-items:center; gap:13px; padding:9px 2px;
         border-bottom:1px solid var(--rule-2); }
.gitem .gn { flex:none; width:44px; height:34px; border-radius:8px; display:grid;
             place-items:center; font-size:15px; font-weight:600;
             border:1px solid var(--rule); color:var(--ink-2); }
.gitem.good .gn { color:var(--mint); border-color:var(--mint); background:var(--mint-soft); }
.gitem.bad .gn  { color:var(--coral); border-color:var(--coral); background:var(--coral-soft); }
.gitem .gb { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.gitem .gw { font-weight:500; line-height:1.3; }
.gitem .gm { font-size:11.5px; color:var(--ink-3); }
.gdel { flex:none; width:32px; height:32px; border-radius:8px; background:transparent;
        border:1px solid var(--rule); color:var(--ink-3); display:grid; place-items:center; }
.gdel:hover { color:var(--coral); border-color:var(--coral); }
.gdel:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }

.gavg { display:grid; grid-template-columns:repeat(auto-fit,minmax(122px,1fr));
        gap:9px; margin-top:16px; }
.ga { background:var(--panel-2); border:1px solid var(--rule-2); border-radius:10px;
      padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
.ga .gan { font-size:12.5px; font-weight:500; }
.ga .gav { font-family:"Chakra Petch",sans-serif; font-size:21px; font-weight:700;
           color:var(--ink-2); line-height:1.15; }
.ga.good .gav { color:var(--mint); }
.ga.bad .gav { color:var(--coral); }
.ga.empty .gav { color:var(--ink-3); }
.ga .gac { font-size:10.5px; color:var(--ink-3); }

.prog { margin-top:18px; padding-top:16px; border-top:1px solid var(--rule); }
.proghead { display:flex; align-items:center; justify-content:space-between;
            gap:12px; flex-wrap:wrap; margin-bottom:11px; }

  var NOTEN_SCHLUESSEL = [

  function punkteZuNote(p) {
    var v = Number(p);
    if (p === "" || p === null || !isFinite(v)) return null;
    v = Math.max(0, Math.min(100, v));
    for (var i = 0; i < NOTEN_SCHLUESSEL.length; i++) {
      if (v >= NOTEN_SCHLUESSEL[i].ab) return NOTEN_SCHLUESSEL[i].note;

    for (var i = 0; i < NOTEN_SCHLUESSEL.length; i++) {

      { lv:[2,4], t:"mc", q:"Was verlangt das strenge Niederstwertprinzip im Umlaufvermögen?",

      { lv:[2,4], t:"num", q:"Materialeinzelkosten 10.000 €, Materialgemeinkostenzuschlag 15 %. Wie hoch sind die Materialkosten in Euro?",

      { lv:[3,5], t:"num", q:"Verkaufspreis 80 €, variable Stückkosten 50 €, Fixkosten 60.000 €. Ab wie vielen Stück ist die Gewinnschwelle erreicht?",

      { lv:[4,6], t:"num", q:"Anschaffungskosten 50.000 €, degressive Abschreibung 20 %. Wie hoch ist der Abschreibungsbetrag im zweiten Jahr in Euro?",

      { lv:[3,5], t:"mc", q:"Worin unterscheiden sich Gesamtkosten- und Umsatzkostenverfahren?",

      { lv:[4,6], t:"mc", q:"Bei steigenden Einkaufspreisen führt das Lifo-Verfahren im Vergleich zu Fifo zu …",

      { lv:[2,4], t:"mc", q:"Wie kann ein Auszubildender nach der Probezeit selbst kündigen?",

           "Fristlos ohne Grund","Nur mit Zustimmung der IHK"], k:1,
        why:"§ 22 BBiG: Der Ausbildende kann nach der Probezeit nur noch aus wichtigem Grund fristlos kündigen, der Auszubildende zusätzlich mit vier Wochen Frist bei Berufsaufgabe oder -wechsel." },
      { lv:[2,4], t:"mc", q:"Was besagt das Günstigkeitsprinzip im Arbeitsrecht?",
        a:["Der Arbeitgeber darf jederzeit vom Tarif abweichen","Eine Einzelabrede geht dem Tarifvertrag vor, wenn sie für den Arbeitnehmer günstiger ist",
           "Der Tarifvertrag gilt immer uneingeschränkt","Betriebsvereinbarungen sind unwirksam"], k:1,
        why:"Die Rangfolge Gesetz – Tarifvertrag – Betriebsvereinbarung – Arbeitsvertrag gilt nur nach unten. Nach oben darf jede Ebene besser sein als die darüber." },
      { lv:[3,5], t:"num", q:"Welchen Anteil am Beitrag zur gesetzlichen Rentenversicherung trägt der Arbeitnehmer in Prozent?",
        a:50, tol:0, unit:"%",
        why:"Renten-, Kranken- und Arbeitslosenversicherung werden hälftig geteilt. Die Unfallversicherung zahlt der Arbeitgeber allein, bei der Pflegeversicherung gibt es einen Zuschlag für Kinderlose." },
      { lv:[3,5], t:"mc", q:"Wann kommt ein Schuldner ohne Mahnung in Verzug?",
        a:["Nie","Wenn für die Leistung eine Zeit nach dem Kalender bestimmt ist, oder 30 Tage nach Zugang der Rechnung",
           "Sofort mit Vertragsschluss","Erst nach der dritten Mahnung"], k:1,
        why:"§ 286 BGB. Steht ein Datum im Vertrag, mahnt der Kalender. Sonst tritt Verzug spätestens 30 Tage nach Zugang der Rechnung ein — bei Verbrauchern nur, wenn darauf hingewiesen wurde." },
      { lv:[3,5], t:"mc", q:"Was regelt die Montan-Mitbestimmung im Unterschied zum Drittelbeteiligungsgesetz?",
        a:["Sie gilt für alle Betriebe","Sie sieht im Aufsichtsrat die paritätische Besetzung samt neutralem Mitglied vor",
           "Sie schafft den Betriebsrat ab","Sie gilt nur für Auszubildende"], k:1,
        why:"Kohle und Stahl haben die weitestgehende Mitbestimmung: Anteilseigner und Arbeitnehmer stellen gleich viele Sitze, dazu kommt ein neutrales Mitglied. Nach dem Drittelbeteiligungsgesetz ist nur ein Drittel des Aufsichtsrats Arbeitnehmerseite." },
      { lv:[4,6], t:"num", q:"Ein Betrieb hat 900 wahlberechtigte Arbeitnehmer. Aus wie vielen Mitgliedern besteht der Betriebsrat?",
        a:13, tol:0, unit:"Mitglieder",
        why:"§ 9 BetrVG staffelt: 701 bis 1.000 Arbeitnehmer ergeben 13 Betriebsratsmitglieder. Ab 200 Arbeitnehmern ist mindestens ein Mitglied freizustellen." },
      { lv:[4,6], t:"num", q:"Ein Preisindex steigt von 110 auf 115,5. Wie hoch ist die Inflationsrate in Prozent?",
        a:5, tol:0.05, unit:"%",
        why:"(115,5 − 110) ÷ 110 = 5 %. Die Rate misst die Veränderung des Index, nicht seinen Stand — ein Index von 115,5 sagt für sich genommen noch nichts über die Teuerung des letzten Jahres." },
      { lv:[4,6], t:"mc", q:"Wie wirkt eine Leitzinserhöhung der Europäischen Zentralbank?",
        a:["Kredite werden billiger, die Nachfrage steigt","Kredite werden teurer, Investitionen und Nachfrage gehen zurück, die Inflation soll sinken",
           "Die Staatsverschuldung sinkt automatisch","Der Wechselkurs bleibt unverändert"], k:1,
        why:"Teureres Geld bremst Konsum und Investitionen. Das ist der Preis: Die Inflation sinkt, die Konjunktur kühlt ab. Die EZB ist auf Preisstabilität verpflichtet, nicht auf Wachstum." },
      { lv:[4,6], t:"mc", q:"Wofür haftet ein Kommanditist?",
        a:["Unbeschränkt mit seinem Privatvermögen","Nur bis zur Höhe seiner im Handelsregister eingetragenen Einlage",
           "Gar nicht","Gesamtschuldnerisch wie der Komplementär"], k:1,
        why:"Die KG lebt von dieser Zweiteilung: Der Komplementär haftet unbeschränkt und führt die Geschäfte, der Kommanditist gibt Kapital und haftet begrenzt — hat dafür aber keine Geschäftsführungsbefugnis." },
      { lv:[4,6], t:"mc", q:"Welche vier Ziele nennt das magische Viereck des Stabilitätsgesetzes?",
        a:["Wachstum, Vollbeschäftigung, Preisstabilität, aussenwirtschaftliches Gleichgewicht",
           "Gewinn, Umsatz, Marktanteil, Rendite","Bildung, Gesundheit, Umwelt, Verkehr",
           "Steuern, Schulden, Zinsen, Sparen"], k:0,
        why:"Magisch heisst es, weil sich die vier Ziele gegenseitig behindern: Vollbeschäftigung treibt oft die Preise, ein Exportüberschuss belastet das aussenwirtschaftliche Gleichgewicht. Alle vier zugleich sind kaum zu haben." },
      { lv:[4,6], t:"mc", q:"In welcher Konjunkturphase sind die Kapazitäten voll ausgelastet und Preise wie Löhne steigen am stärksten?",
        a:["Depression","Aufschwung","Hochkonjunktur","Rezession"], k:2,
        why:"Im Boom ist die Arbeitslosigkeit am niedrigsten und die Auftragsbücher sind voll. Weil kaum noch Kapazität frei ist, wirkt zusätzliche Nachfrage fast nur noch auf die Preise — genau hier setzt die Notenbank mit höheren Zinsen an." },

    deutsch: [
      { lv:[1,3], t:"mc", q:"Wie ist eine lineare Erörterung aufgebaut?",
        a:["Pro, Contra, Synthese","Argumente einer Richtung, vom schwächsten zum stärksten",
           "Behauptung, Gegenbehauptung, Beispiel","Einleitung, Nacherzählung, Schluss"], k:1,
        why:"Die lineare (steigernde) Erörterung verfolgt eine Richtung und steigert sich zum stärksten Argument. Pro und Contra gehören zur dialektischen Form." },
      { lv:[1,3], t:"mc", q:"Woraus besteht ein vollständiges Argument?",
        a:["Behauptung und Meinung","Behauptung, Begründung, Beispiel",
           "These und Gegenthese","Einleitung und Schluss"], k:1,
        why:"Ohne Begründung ist es eine Behauptung, ohne Beispiel bleibt es abstrakt. Erst alle drei Teile machen ein tragfähiges Argument." },
      { lv:[1,3], t:"mc", q:"Wann schreibt man „dass“ mit Doppel-s?",
        a:["Wenn es sich auf ein Nomen bezieht","Wenn es einen Nebensatz einleitet",
           "Immer am Satzanfang","Wenn man es durch „welches“ ersetzen kann"], k:1,
        why:"„dass“ ist die Konjunktion und leitet einen Nebensatz ein. Lässt sich das Wort durch „dieses“, „jenes“ oder „welches“ ersetzen, ist es das Artikel- oder Relativpronomen „das“." },
      { lv:[2,4], t:"mc", q:"Wie ist die dialektische Erörterung aufgebaut?",
        a:["These, Antithese, Synthese","Nur Pro-Argumente","Nur Contra-Argumente",
           "Chronologisch nach Wichtigkeit"], k:0,
        why:"Erst die eine Seite, dann die Gegenseite, dann die begründete eigene Position. Das stärkste Argument der bevorzugten Seite steht zuletzt." },
      { lv:[2,4], t:"mc", q:"Bei welchem erweiterten Infinitiv mit „zu“ ist das Komma Pflicht?",
        a:["Bei jedem erweiterten Infinitiv","Wenn er mit um, ohne, statt, anstatt oder außer eingeleitet wird",
           "Nur am Satzanfang","Nie"], k:1,
        why:"Diese Einleitewörter erzwingen das Komma. Sonst darf es zur besseren Lesbarkeit gesetzt werden, muss aber nicht." },
      { lv:[2,4], t:"mc", q:"Zwei vollständige Hauptsätze werden mit „und“ verbunden. Was gilt für das Komma?",
        a:["Es ist verboten","Es darf gesetzt werden, muss aber nicht",
           "Es ist immer Pflicht","Nur bei mehr als zehn Wörtern"], k:1,
        why:"Seit der Reform ist das Komma vor „und“ zwischen Hauptsätzen freigestellt — sinnvoll, wenn es die Gliederung deutlicher macht." },
      { lv:[3,5], t:"mc", q:"Was ist ein Scheinargument?",
        a:["Ein Argument der Gegenseite","Eine Behauptung ohne tragfähige Begründung",
           "Ein Argument mit Beispiel","Das stärkste Argument im Schluss"], k:1,
        why:"Typische Formen sind der Verweis auf eine Autorität, auf die Mehrheit oder auf Tradition — sie belegen die Behauptung nicht, sie umgehen den Beleg." },
      { lv:[3,5], t:"mc", q:"Was gehört nicht in eine sachliche Erörterung?",
        a:["Belegte Zahlen","Gegenargumente","Pauschale Übertreibungen und Ich-Meinungen ohne Begründung",
           "Eine begründete eigene Position im Schluss"], k:2,
        why:"Die eigene Position gehört in den Schluss — aber begründet. „Ich finde das einfach falsch“ ist kein Argument." },
      { lv:[4,6], t:"mc", q:"Welche Verbform steht in der indirekten Rede?",
        a:["Konjunktiv I","Konjunktiv II","Indikativ","Imperativ"], k:0,
        why:"Konjunktiv I markiert die Wiedergabe fremder Rede: „Er sagte, er komme später.“ Konjunktiv II tritt nur ein, wenn Konjunktiv I mit dem Indikativ zusammenfällt." },
      { lv:[4,6], t:"mc", q:"Welcher Satz ist im Nominalstil geschrieben?",
        a:["Wir prüfen den Antrag.","Die Prüfung des Antrags erfolgt durch uns.",
           "Der Antrag wird geprüft.","Prüfe den Antrag!"], k:1,
        why:"Nominalstil türmt Substantivierungen auf und wirkt schwerfällig. Verben machen Sätze kürzer und klarer — im Fachgespräch entscheidend." },
      { lv:[1,3], t:"mc", q:"In welchem Tempus wird eine Inhaltsangabe geschrieben?",
        a:["Präteritum","Präsens","Perfekt","Futur"], k:1,
        why:"Präsens, durchgehend und ohne wörtliche Rede. Vorzeitiges wird im Perfekt wiedergegeben. Eigene Wertungen bleiben draussen." },
      { lv:[1,3], t:"mc", q:"Wann schreibt man „seit\u201c und wann „seid\u201c?",
        a:["seit ist immer richtig","seit meint die Zeit, seid ist die Form von sein in der 2. Person Plural",
           "Beides ist gleichbedeutend","seid nur am Satzanfang"], k:1,
        why:"Seit gestern, seit drei Jahren — das ist die Zeitangabe. Ihr seid pünktlich — das ist das Verb. Die Probe: Lässt sich ihr einsetzen, steht seid." },
      { lv:[2,4], t:"mc", q:"Worin unterscheidet sich das Ergebnisprotokoll vom Verlaufsprotokoll?",
        a:["Es ist länger","Es hält nur Beschlüsse und Ergebnisse fest, nicht den Gang der Diskussion",
           "Es wird in der Ich-Form geschrieben","Es braucht keine Unterschrift"], k:1,
        why:"Das Ergebnisprotokoll ist im Betrieb der Regelfall: Wer macht was bis wann. Das Verlaufsprotokoll zeichnet zusätzlich den Weg dorthin nach und ist bei strittigen Themen sinnvoll." },
      { lv:[2,4], t:"mc", q:"Welche Schreibweise ist richtig?",
        a:["Er ist sitzen geblieben, weil er zu wenig gelernt hat.","Er ist sitzengeblieben, weil er zu wenig gelernt hat.",
           "Er ist Sitzen geblieben.","Er ist sitzen-geblieben."], k:0,
        why:"Verb plus Verb wird getrennt geschrieben. Zusammen bleibt es nur bei übertragener Bedeutung, und selbst dort ist die Getrenntschreibung zulässig." },
      { lv:[3,5], t:"mc", q:"Wie ist eine Sachtextanalyse aufgebaut?",
        a:["Einleitung mit Textsorte, Autor, Thema — dann Inhalt, dann Aufbau und Sprache, zuletzt Wirkungsabsicht",
           "Nacherzählung und eigene Meinung","Pro und Contra","Nur Zitate mit Zeilenangabe"], k:0,
        why:"Die Einleitung nennt Textsorte, Verfasser, Erscheinungsdatum und Kernthese in einem Satz. Der Hauptteil arbeitet Argumentationsgang und sprachliche Mittel heraus, der Schluss beurteilt die Wirkung auf den Leser." },
      { lv:[3,5], t:"mc", q:"Welches rhetorische Mittel liegt vor: „Wir brauchen Mut, wir brauchen Klarheit, wir brauchen Entschlossenheit\u201c?",
        a:["Ironie","Anapher","Hyperbel","Euphemismus"], k:1,
        why:"Die Anapher wiederholt am Satz- oder Satzgliedanfang. Sie steigert und prägt sich ein — deshalb steht sie so oft in Reden und in Werbung." },
      { lv:[3,5], t:"mc", q:"Wie wird ein wörtliches Zitat in einer Textanalyse korrekt eingebaut?",
        a:["Ohne Kennzeichnung","In Anführungszeichen, grammatisch in den eigenen Satz eingepasst, mit Zeilenangabe",
           "Immer als eigener Absatz","Nur sinngemäss"], k:1,
        why:"Das Zitat muss in den eigenen Satzbau passen; Anpassungen kommen in eckige Klammern, Auslassungen werden mit drei Punkten in eckigen Klammern markiert. Ohne Beleg ist es kein Zitat, sondern eine Behauptung." },
      { lv:[4,6], t:"mc", q:"Wann tritt in der indirekten Rede der Konjunktiv II an die Stelle des Konjunktiv I?",
        a:["Nie","Wenn die Form des Konjunktiv I mit dem Indikativ zusammenfällt",
           "Immer in der Vergangenheit","Nur in der ersten Person"], k:1,
        why:"Sie sagten, sie haben keine Zeit — hier ist haben zugleich Indikativ, die Wiedergabe wäre nicht erkennbar. Deshalb: sie hätten keine Zeit." },
      { lv:[4,6], t:"mc", q:"Warum ist Aktiv im Geschäftsbrief dem Passiv meist vorzuziehen?",
        a:["Passiv ist grammatisch falsch","Aktiv nennt den Handelnden und macht Verantwortung sichtbar",
           "Aktiv ist immer kürzer","Passiv ist unhöflich"], k:1,
        why:"Ihre Rechnung wurde geprüft lässt offen, wer geprüft hat und wer nun zuständig ist. Wir haben Ihre Rechnung geprüft benennt beides — im Fachgespräch wie im Schriftverkehr der Unterschied zwischen Auskunft und Ausflucht." },
      { lv:[4,6], t:"mc", q:"Was ist ein normatives Argument?",
        a:["Ein Argument mit Zahlen","Ein Argument, das sich auf allgemein anerkannte Werte und Normen stützt",
           "Ein Argument aus eigener Erfahrung","Ein Argument einer Fachautorität"], k:1,
        why:"Neben dem Faktenargument mit belegbaren Zahlen und dem Autoritätsargument steht das normative: Es beruft sich auf Gerechtigkeit, Fairness oder Gesundheit. Stark ist es nur, wenn die Norm wirklich geteilt wird." },
      { lv:[4,6], t:"mc", q:"Wie ist eine Präsentation für das Fachgespräch sinnvoll aufgebaut?",
        a:["Alle Einzelheiten der Reihe nach","Ausgangslage, Vorgehen, Ergebnis, Bewertung — und am Ende die eigene Rolle",
           "Nur Folien mit Stichworten","Chronologisch nach Arbeitstagen"], k:1,
        why:"Der Prüfungsausschuss fragt nach der eigenen Leistung und nach Alternativen, die verworfen wurden. Deshalb gehört die Begründung der Entscheidungen in die Struktur, nicht nur das Ergebnis." },
      { lv:[4,6], t:"mc", q:"Welcher Satz setzt die Kommas bei der Apposition richtig?",
        a:["Herr Weber, unser Ausbilder erklärt das Verfahren.","Herr Weber, unser Ausbilder, erklärt das Verfahren.",
           "Herr Weber unser Ausbilder, erklärt das Verfahren.","Herr Weber unser Ausbilder erklärt das Verfahren."], k:1,
        why:"Die Apposition wird beidseitig eingeschlossen. Fehlt das zweite Komma, ist der Satz zerrissen — ein Fehler, der in Erörterungen häufig unbemerkt bleibt." },
      { lv:[4,6], t:"mc", q:"Welche Formulierung ist im Schriftverkehr vorzuziehen?",
        a:["Nach Inkenntnissetzung durch Ihr Schreiben erfolgt unsererseits die Veranlassung der Prüfung.",
           "Wir haben Ihr Schreiben erhalten und prüfen den Vorgang.",
           "Diesbezüglich wird auf obiges Bezug genommen.","In Ansehung Ihres Anliegens verbleiben wir."], k:1,
        why:"Substantivierungen auf -ung, Streckverben und Amtsdeutsch verlängern den Satz und verstecken den Handelnden. Kurze Sätze mit echten Verben wirken sicherer, nicht schlichter." },
    ],
    englisch: [
      { lv:[1,3], t:"mc", q:"What is an enquiry in business correspondence?",
        a:["A request for information, prices or an offer","A confirmation of an order",
           "A reminder to pay an invoice","A complaint about damaged goods"], k:0,
        why:"Die Anfrage eröffnet den Schriftwechsel. Darauf folgt das Angebot (offer/quotation), dann die Bestellung (order)." },
      { lv:[1,3], t:"mc", q:"What does invoice mean?",
        a:["Lieferschein","Rechnung","Auftragsbestätigung","Mahnung"], k:1,
        why:"invoice = Rechnung. Lieferschein ist delivery note, Auftragsbestätigung order confirmation, Mahnung reminder." },
      { lv:[1,3], t:"mc", q:"Which sentence belongs in an offer?",
        a:["We regret to inform you that the goods are damaged.",
           "We are pleased to offer you the following terms.",
           "Please send us your latest catalogue.",
           "Your payment is now four weeks overdue."], k:1,
        why:"Das Angebot nennt Ware, Preis, Liefer- und Zahlungsbedingungen sowie die Bindungsfrist." },
      { lv:[2,4], t:"mc", q:"Under EXW (Ex Works), who bears most of the cost and risk?",
        a:["The seller","The buyer","Both equally","The carrier"], k:1,
        why:"Bei Ex Works stellt der Verkäufer die Ware nur bereit. Transport, Versicherung, Verzollung und Risiko liegen fast vollständig beim Käufer." },
      { lv:[2,4], t:"mc", q:"Under FOB, when does the risk pass to the buyer?",
        a:["When the goods leave the seller's warehouse",
           "When the goods are on board the vessel",
           "When the goods arrive at the destination port",
           "When the invoice is paid"], k:1,
        why:"Free on Board: Der Gefahrübergang findet an Bord des Schiffes im Verschiffungshafen statt." },
      { lv:[2,4], t:"mc", q:"Which letter would start: We regret to inform you that the goods arrived damaged?",
        a:["An enquiry","A complaint","An offer","An order confirmation"], k:1,
        why:"Die Reklamation nennt Sendung und Mangel, belegt ihn und fordert eine konkrete Abhilfe — replacement, credit note oder discount." },
      { lv:[3,5], t:"mc", q:"Payment terms say net 30. What does that mean?",
        a:["30 % discount","Payment due within 30 days",
           "30 days after delivery there is a penalty","Payment in 30 instalments"], k:1,
        why:"Der Rechnungsbetrag ist ohne Abzug binnen 30 Tagen fällig. „2/10 net 30“ hieße zusätzlich 2 % Skonto bei Zahlung innerhalb von zehn Tagen." },
      { lv:[3,5], t:"mc", q:"In an e-mail, which word is correct for a file you send along?",
        a:["enclosed","attached","included","added"], k:1,
        why:"Please find attached gilt für E-Mails, enclosed für Briefe mit Anlage." },
      { lv:[4,6], t:"mc", q:"What does CIF stand for?",
        a:["Cost, Insurance and Freight","Carriage in Full","Customs Included Free",
           "Cost In Factory"], k:0,
        why:"Der Verkäufer zahlt Fracht und Versicherung bis zum Bestimmungshafen — der Gefahrübergang findet aber bereits bei der Verladung statt." },
      { lv:[4,6], t:"mc", q:"A supplier writes: The item is currently out of stock, but we can deliver by 15 May. What is this?",
        a:["A counter-offer within the order process","A complaint","An enquiry","A final reminder"], k:0,
        why:"Weicht die Antwort vom Bestellinhalt ab, ist es rechtlich ein neues Angebot — der Besteller muss zustimmen." },
      { lv:[1,3], t:"mc", q:"What is a quotation in business correspondence?",
        a:["A reminder to pay","A binding or non-binding offer stating prices and terms",
           "A delivery note","A complaint"], k:1,
        why:"Quotation und offer meinen dasselbe: das Angebot. Achte auf die Bindung — subject to change bedeutet freibleibend, firm offer bindet den Verkäufer." },
      { lv:[1,3], t:"mc", q:"Which document accompanies the goods and lists what has been sent?",
        a:["The invoice","The delivery note","The order confirmation","The statement of account"], k:1,
        why:"Delivery note ist der Lieferschein und reist mit der Ware. Die invoice kommt getrennt, oft später und an eine andere Abteilung." },
      { lv:[2,4], t:"mc", q:"Under DDP, who clears the goods for import and pays the duty?",
        a:["The buyer","The seller","The carrier","Customs pays nothing is due"], k:1,
        why:"Delivered Duty Paid ist die weitestgehende Pflicht für den Verkäufer: Er trägt Transport, Risiko, Einfuhrabfertigung und Zoll bis zum benannten Ort. EXW ist das andere Ende der Skala." },
      { lv:[2,4], t:"mc", q:"Which phrase is the more formal way to ask for a fast answer?",
        a:["Answer quickly, please.","We would appreciate an early reply.",
           "Write back soon!","Reply immediately."], k:1,
        why:"Im Handelsenglisch wird die Bitte durch Konjunktiv und Substantiv gedämpft. Direkte Imperative wirken im Schriftverkehr unhöflich, auch wenn sie grammatisch richtig sind." },
      { lv:[3,5], t:"mc", q:"Payment terms read 2/10 net 30. What do they mean?",
        a:["2 % discount within 10 days, full amount due within 30 days",
           "2 € discount after 10 days","10 % discount within 2 days","30 instalments over 10 months"], k:0,
        why:"Die erste Zahl ist der Skontosatz, die zweite die Skontofrist, die dritte das Zahlungsziel. 2/10 net 30 entspricht dem deutschen 2 % Skonto in 10 Tagen, 30 Tage netto." },
      { lv:[3,5], t:"mc", q:"What is the usual order of the three reminder stages?",
        a:["Final demand, reminder, statement","Friendly reminder, second reminder, final demand before legal action",
           "Invoice, delivery note, receipt","Complaint, offer, order"], k:1,
        why:"Erst der freundliche Hinweis, dann die deutlichere Mahnung mit Frist, zuletzt die Androhung rechtlicher Schritte. Der Ton verschärft sich, die Höflichkeitsformeln bleiben." },
      { lv:[3,5], t:"mc", q:"What does a letter of credit do?",
        a:["It grants the buyer a loan","A bank undertakes to pay the seller once the agreed documents are presented",
           "It insures the goods in transit","It replaces the contract"], k:1,
        why:"Das Akkreditiv schiebt eine Bank zwischen die Parteien: Der Verkäufer bekommt sein Geld gegen Dokumente, der Käufer zahlt erst, wenn die Papiere stimmen. Üblich im Überseegeschäft mit unbekannten Partnern." },
      { lv:[4,6], t:"mc", q:"What is a bill of lading?",
        a:["A packing list","A document of title to the goods, issued by the carrier in sea freight",
           "A customs declaration","An insurance policy"], k:1,
        why:"Das Konnossement ist Empfangsbestätigung, Frachtvertrag und Warenwertpapier in einem. Wer es besitzt, kann die Ware herausverlangen — deshalb wird es beim Akkreditiv verlangt." },
      { lv:[4,6], t:"mc", q:"What does an arbitration clause provide for?",
        a:["Automatic cancellation of the contract","Settlement of disputes by an arbitral tribunal instead of the ordinary courts",
           "A price adjustment","An extension of the delivery period"], k:1,
        why:"Die Schiedsklausel bestimmt Schiedsgericht, Ort und Sprache. Sie ist im internationalen Geschäft verbreitet, weil ein Schiedsspruch leichter vollstreckbar ist als ein ausländisches Gerichtsurteil." },
      { lv:[4,6], t:"mc", q:"A contract contains a force majeure clause. What is its effect?",
        a:["The price may be raised at any time","Neither party is liable for delay caused by events beyond its control, such as flood or war",
           "The buyer may cancel without reason","Delivery is always free of charge"], k:1,
        why:"Höhere Gewalt entschuldigt die Nichterfüllung, solange das Ereignis unvorhersehbar und unabwendbar ist. Streik und Rohstoffmangel gehören nur dazu, wenn die Klausel sie ausdrücklich nennt." },
      { lv:[4,6], t:"mc", q:"What is a proforma invoice used for?",
        a:["To demand payment","As a preliminary invoice for customs, import licences or advance payment",
           "To confirm receipt of goods","To cancel an order"], k:1,
        why:"Die Proformarechnung fordert kein Geld. Sie belegt den Wert der Sendung gegenüber Zoll und Behörden oder dient als Grundlage für eine Vorauszahlung." },
      { lv:[4,6], t:"mc", q:"An offer says: subject to prior sale. What does that mean?",

  /* ---- Kalender --------------------------------------------------------- */

  function blockZeit(b) {

    var jetzt = null, naechst = null;
    for (var k = 0; k < mit.length; k++) {

      if (minute >= mit[k].z && minute < bis) jetzt = mit[k];

  function evaluate(state, today) {

    var attrXp = {}, attrMin = {};

            // nicht die Belohnung fürs Durchhalten.

    star: '<path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.4L12 17l-5.6 3.3 1.3-6.4L3 9.6l6.3-.7z"/>',
    bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 3H4zM10 22h4"/>',
    undo: '<path d="M4 9h11a5 5 0 0 1 0 10h-6M4 9l4-4M4 9l4 4"/>',
    timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>'

  function icon(name, size) {

    m = Math.max(0, Math.round(m || 0));

    return r ? h + " h " + pad(r) : h + " h";
  }

  /* ---- Zustand ---------------------------------------------------------- */
  var state = { v: 4, d: {}, f: {}, n: {}, w: {}, q: {}, g: [], t: null,
                zn: 1.9, zw: 900, updatedAt: 0 };
  var saveMode = "lokal";  // "lokal" | "geteilt"
  var statusTxt = "nur auf diesem Gerät";
  var saveTimer = null, artifactApi = null, lastFloat = null, nachholen = false;

  /*  Der betrachtete Tag überlebt das Neuladen.
      Grund: jede Veröffentlichung lädt alle offenen Ansichten neu. Vorher
      sprang die Ansicht deshalb mitten im Nachtragen zurück auf heute.
      sessionStorage statt localStorage — der Blick zurück gilt für diesen Tab
      und diese Sitzung, nicht für das nächste Öffnen. Gespeichert wird das
      Datum, nicht der Abstand: über Nacht bleibt so derselbe Tag stehen.     */
  var VIEW_KEY = "lernquest.view";
  var VIEW_TTL = 6 * 3600 * 1000;
  function readView() {
    try {
      var raw = JSON.parse(sessionStorage.getItem(VIEW_KEY) || "null");
      if (!raw || !raw.k || Date.now() - (Number(raw.t) || 0) > VIEW_TTL) return 0;
      var off = Math.round((fromYmd(raw.k) - today()) / 86400000);
      return off < 0 && off > -400 ? off : 0;
    } catch (e) { return 0; }
  }
  function setView(nOff) {
    view = nOff > 0 ? 0 : nOff < -400 ? -400 : nOff;
    try {
      sessionStorage.setItem(VIEW_KEY,
        JSON.stringify({ k: ymd(addDays(today(), view)), t: Date.now() }));
    } catch (e) { /* privater Modus — dann eben ohne */ }
  }
  var view = readView();   // 0 = heute, negativ = zurückgeblättert

  /* ---- Rückgängig --------------------------------------------------------
     Wie im Mac-Widget: vor jedem Handgriff, der etwas wegnehmen kann, wandert
     eine Kopie des Zustands beiseite. Eine Minute lang steht sie zur Verfügung,
     danach verfällt sie — länger will das niemand zurücknehmen.             */
  var UNDO_MS = 60000;
  var rueck = null;   // { stand, at, was }

  function merke(was) {
    try { rueck = { stand: JSON.parse(JSON.stringify(state)), at: Date.now(), was: was }; }
    catch (e) { rueck = null; }
  }
  function rueckBereit() {
    return rueck && Date.now() - rueck.at < UNDO_MS ? rueck.was : null;
  }
  function rueckNehmen() {
    var was = rueckBereit();
    if (!was) return;
    state = rueck.stand;
    rueck = null;
    save(); render(); sag("Zurückgenommen: " + was);
  }

  /* ---- Ansage ------------------------------------------------------------
     Alles, was nur als Farbe oder Zahl erscheint, geht zusätzlich hier durch —
     sonst bleibt jede Rückmeldung unsichtbar, wenn die Seite vorgelesen wird. */
  function sag(txt) {
    var el = document.getElementById("ansage");
    if (el) el.textContent = txt;
  }

  /* ---- Auswertung merken -------------------------------------------------
     evaluate() läuft über bis zu 400 Tage und wurde bei jedem Klick neu
     angeworfen. Der Zustand ändert sich nur über save(), das updatedAt
     hochsetzt — das reicht als Kennung.                                     */
  var evMemo = null;
  function auswerten(st, heute) {
    var schl = st.updatedAt + "|" + ymd(heute);
    if (evMemo && evMemo.schl === schl) return evMemo.wert;
    evMemo = { schl: schl, wert: evaluate(st, heute) };
    return evMemo.wert;
  }

  /* ---- Fokus über das Neuzeichnen retten ---------------------------------
     render() ersetzt das gesamte DOM. Ohne das hier springt der Tastaturfokus
     nach jedem Häkchen zurück an den Seitenanfang.                          */
  var FOKUS_ATTR = ["data-id", "data-off", "data-attr"];
  function fokusMerken() {
    var el = document.activeElement;
    if (!el || el === document.body || !el.getAttribute) return null;
    var pos = null;
    try { pos = el.selectionStart; } catch (e) { pos = null; }
    if (el.id) return { sel: "#" + el.id, pos: pos };
    var act = el.getAttribute("data-act");
    if (!act) return null;
    var sel = '[data-act="' + act + '"]';
    for (var i = 0; i < FOKUS_ATTR.length; i++) {
      var v = el.getAttribute(FOKUS_ATTR[i]);
      if (v !== null) { sel += "[" + FOKUS_ATTR[i] + '="' + v + '"]'; break; }
    }
    return { sel: sel, pos: null };
  }
  function fokusSetzen(f) {
    if (!f) return;
    var el = null;
    try { el = document.querySelector(f.sel); } catch (e) { return; }
    if (!el || typeof el.focus !== "function") return;
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    if (f.pos !== null && f.pos !== undefined && el.setSelectionRange) {
      // Zahlen- und Datumsfelder lassen keine Auswahl setzen — dann eben nicht.
      try { el.setSelectionRange(f.pos, f.pos); } catch (e) { /* egal */ }
    }
  }

  function readEmbedded() {
    var el = document.getElementById("state");
    if (!el) return null;
    try { return JSON.parse(el.textContent || "{}"); } catch (e) { return null; }
  }
  function readLocal() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { return null; }
  }
  var gid = 0;
  function normalize(o) {
    var s = { v: 4, d: {}, f: {}, n: {}, w: {}, q: {}, g: [], t: null,
              zn: 1.9, zw: 900, updatedAt: 0 };
    if (!o || typeof o !== "object") return s;
    if (o.d && typeof o.d === "object") {
      Object.keys(o.d).forEach(function (k) {
        if (Array.isArray(o.d[k])) s.d[k] = o.d[k].filter(function (x) { return typeof x === "string"; });
      });
    }
    if (o.f && typeof o.f === "object") {
      Object.keys(o.f).forEach(function (k) {
        s.f[k] = typeof o.f[k] === "string" && o.f[k] ? o.f[k] : "frei";
      });
    }
    // n: eine Notizzeile je Tag. w: bis zu drei Schwerpunkte je Kalenderwoche.
    // Beide schreibt auch das Mac-Widget — deshalb hier nur prüfen, nicht deuten.
    if (o.n && typeof o.n === "object") {
      Object.keys(o.n).forEach(function (k) {
        var v = o.n[k];
        if (typeof v === "string" && v.trim()) s.n[k] = v.slice(0, 280);
      });
    }
    if (o.w && typeof o.w === "object") {
      Object.keys(o.w).forEach(function (k) {
        if (!Array.isArray(o.w[k])) return;
        var l = o.w[k].filter(function (x) { return typeof x === "string" && x.trim(); })
                      .map(function (x) { return x.slice(0, 90); }).slice(0, 3);
        if (l.length) s.w[k] = l;
      });
    }
    // q: höchste bestandene Stufe je Fach. Das Mac-Widget ignoriert den
    // Schlüssel, das Format bleibt also kompatibel.
    if (o.q && typeof o.q === "object") {
      Object.keys(o.q).forEach(function (k) {
        var v = Math.round(Number(o.q[k]));
        if (v >= 1 && v <= 20) s.q[k] = v;
      });
    }
    // g: Noten als Liste, damit die Reihenfolge der Einträge erhalten bleibt.
    // Das Mac-Widget kennt den Schlüssel nicht und lässt ihn beim Einlesen fallen.
    if (Array.isArray(o.g)) {
      s.g = o.g.filter(function (e) { return e && typeof e === "object"; })
        .map(function (e) {
          var nt = Number(e.n);
          // Number(null) ist 0 — ohne diese Abfrage bekäme jede Note ohne
          // Punktzahl kommentarlos 0 Punkte angehängt.
          var pk = (e.p === null || e.p === undefined || e.p === "") ? NaN : Number(e.p);
          return {
            id: String(e.id || ("g" + (++gid) + "-" + Math.random().toString(36).slice(2, 7))),
            fach: String(e.fach || ""),
            was: String(e.was || "").slice(0, 80),
            n: isFinite(nt) && nt >= 1 && nt <= 6 ? Math.round(nt * 10) / 10 : null,
            p: isFinite(pk) && pk >= 0 && pk <= 100 ? Math.round(pk) : null,
            dat: /^\d{4}-\d{2}-\d{2}$/.test(e.dat) ? e.dat : "",
            gew: isFinite(Number(e.gew)) && Number(e.gew) > 0 ? Math.min(5, Number(e.gew)) : 1
          };
        })
        .filter(function (e) { return e.fach && e.n !== null; });
    }
    // t: der laufende Fokus-Timer, im Format des Mac-Widgets. Ein dort
    // gestarteter Block läuft hier weiter, und umgekehrt.
    if (o.t && typeof o.t === "object" && o.t.id) {
      var st = Number(o.t.start), mi = Number(o.t.mins);
      if (isFinite(st) && st > 0 && isFinite(mi) && mi > 0 && mi <= 600) {
        s.t = { key: String(o.t.key || ""), id: String(o.t.id),
                nm: String(o.t.nm || o.t.id).slice(0, 60),
                mins: Math.round(mi), start: Math.round(st) };
      }
    }
    var z = Number(o.zn);
    s.zn = isFinite(z) && z >= 1 && z <= 6 ? Math.round(z * 10) / 10 : 1.9;
    var zw = Number(o.zw);
    s.zw = isFinite(zw) && zw >= 0 && zw <= 5040 ? Math.round(zw) : 900;
    s.updatedAt = Number(o.updatedAt) || 0;
