  }
  function load() {
    var emb = normalize(readEmbedded()), loc = normalize(readLocal());
    // Der neuere Stand gewinnt — so überlebt ein Klick, dessen Veröffentlichung
    // nicht durchkam, und ein fremdes Gerät bringt seinen Stand mit.
    state = loc.updatedAt > emb.updatedAt ? loc : emb;
  }
  function writeLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* privater Modus */ }
  }

  function buildDoc() {
    var css = document.getElementById("app-style").textContent;
    var app = document.getElementById("app").textContent;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return '<!doctype html>\n<html lang="de">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      "<title>Lernquest Berichtsheft</title>\n" +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link rel="stylesheet" href="' + FONTS + '">\n' +
      '<style id="app-style">' + css + "<\/style>\n</head>\n<body>\n" +
      '<div class="wrap" id="root"></div>\n' +
      '<dialog id="examDlg" aria-label="Stufenprüfung"><div id="examBody"></div>' +
      '<button class="exx" data-act="examClose" type="button" aria-label="Prüfung schließen">✕</button></dialog>\n' +
      '<script type="application/json" id="state">' + json + "<\/script>\n" +
      '<script id="app">' + app + "<\/script>\n</body>\n</html>";
  }

  function save() {
    state.updatedAt = Date.now();
    writeLocal();
    if (!artifactApi) return;
    /*  Zwei Fälle, in denen nicht veröffentlicht wird: das Veröffentlichen lädt
        alle offenen Ansichten neu. Während einer Stufenprüfung risse das den
        Durchgang mittendrin ab — und während ein Timer läuft, wirft es den
        vorgelegten Weckton weg, denn der hängt an dieser Seite.
        Der Stand liegt bereits lokal; nachgeholt wird, sobald beides vorbei ist. */
    if (exam) { nachholen = true; setStatus("wird nach der Prüfung gesichert"); return; }
    if (state.t) { nachholen = true; setStatus("wird nach dem Timer gesichert"); return; }
    if (weckerAn) { nachholen = true; setStatus("wird gesichert, sobald du den Wecker wegklickst"); return; }
    if (saveTimer) clearTimeout(saveTimer);
    // Klicks bündeln: eine Veröffentlichung je Handgriff, nicht je Häkchen.
    saveTimer = setTimeout(function () {
      saveTimer = null;
      setStatus("sichere …");
      artifactApi.publish(buildDoc()).then(function () {
        setStatus("gesichert");
      })["catch"](function (err) {
        // "conflict" heisst: jemand war schneller, die Ansicht lädt ohnehin neu.
        setStatus(err && err.code === "conflict" ? "neu geladen" : "nur auf diesem Gerät");
      });
    }, 1600);
  }
  /*  Der Text überlebt das nächste render() — sonst stünde nach jedem Neubau
      wieder "gesichert" da, auch wenn gerade etwas aussteht.                 */
  function setStatus(txt) {
    statusTxt = txt;
    var el = document.getElementById("savestate");
    if (el) el.textContent = txt;
  }

  /* ---- Stufenprüfung ------------------------------------------------------
     Lernzeit macht prüfungsberechtigt, hier wird die Stufe vergeben.
     Fünf Fragen, ab Stufe 4 muss jede sitzen. Durchgefallen heisst: sofort
     noch einmal, mit frisch gezogenen Fragen.                               */
  var exam = null;   // { attr, ziel, fragen, i, richtig, beantwortet }

  var zuletztGezogen = {};   // je Fach die Fragen des vorigen Versuchs

  function ziehe(liste, wieviel) {
    var rest = liste.slice(), out = [];
    while (rest.length && out.length < wieviel) {
      out.push(rest.splice(Math.floor(Math.random() * rest.length), 1)[0]);
    }
    return out;
  }
  function zieheFragen(attrId, ziel) {
    var alle = QUIZ[attrId] || [];
    var pool = alle.filter(function (f) { return ziel >= f.lv[0] && ziel <= f.lv[1]; });
    // Reicht das Band nicht, mit dem restlichen Fach auffüllen statt abzubrechen
    if (pool.length < 5) {
      alle.forEach(function (f) { if (pool.indexOf(f) < 0) pool.push(f); });
    }
    /*  Beim zweiten Anlauf zuerst das nehmen, was gerade nicht dran war.
        Sonst übt der Wiederholungsversuch nur, wo die richtige Antwort stand.  */
    var alt = zuletztGezogen[attrId] || [];
    var out = ziehe(pool.filter(function (f) { return alt.indexOf(f) < 0; }), 5);
    if (out.length < 5) {
      out = out.concat(ziehe(pool.filter(function (f) { return out.indexOf(f) < 0; }),
                             5 - out.length));
    }
    zuletztGezogen[attrId] = out;
    return out;
  }

  function startExam(attrId) {
    var at = ATTR_BY[attrId];
    var st = standOf(attrId, (lastEv && lastEv.attrXp[attrId]) || 0);
    if (!at || !st.open) return;
    exam = { attr: attrId, ziel: st.next, fragen: zieheFragen(attrId, st.next),
             i: 0, richtig: 0, beantwortet: false, gewaehlt: null };
    zeigeExam();
    var dlg = document.getElementById("examDlg");
    if (dlg && !dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute("open", ""); } }
  }

  function zeigeExam() {
    var box = document.getElementById("examBody");
    if (!box || !exam) return;
    var at = ATTR_BY[exam.attr], n = exam.fragen.length, noetig = huerde(exam.ziel);

    if (exam.i >= n) {
      var ok = exam.richtig >= noetig;
      if (ok) {
        var q = {}; Object.keys(state.q || {}).forEach(function (k) { q[k] = state.q[k]; });
        q[exam.attr] = exam.ziel;
        state.q = q; save();
      }
      box.innerHTML =
        '<div class="exres ' + (ok ? "ok" : "no") + '">' +
        '<div class="big">' + exam.richtig + " von " + n + "</div>" +
        "<h3>" + (ok ? "Bestanden — " + esc(at.nm) + " Stufe " + exam.ziel
                     : "Nicht bestanden") + "</h3>" +
        "<p>" + (ok
          ? "Die Stufe ist freigeschaltet. Die nächste verlangt wieder Lernzeit — und wieder eine Prüfung."
          : "Nötig waren " + noetig + " von " + n + ". Die Erklärungen stehen oben — noch einmal versuchen, die Fragen werden neu gezogen.") +
        "</p><div class=\"exbtns\">" +
        (ok ? '<button class="btn" data-act="examClose" type="button">Weiter</button>'
            : '<button class="btn" data-act="examRetry" type="button">Neuer Versuch</button>' +
              '<button class="btn ghost" data-act="examClose" type="button">Später</button>') +
        "</div></div>";
      render();
      return;
    }

    var f = exam.fragen[exam.i];
    var html = '<div class="exhead"><span class="eyebrow">' + esc(at.nm) +
      " · Stufe " + exam.ziel + " · " + noetig + " von " + n + " nötig</span>" +
      '<span class="expro mono">' + (exam.i + 1) + "/" + n + "</span></div>" +
      '<div class="exq">' + esc(f.q) + "</div>";

    if (f.t === "num") {
      html += '<div class="exnum"><input type="number" id="exNum" step="any" ' +
        'inputmode="decimal" aria-label="Antwort"' +
        (exam.beantwortet ? " disabled" : "") + '>' +
        (f.unit ? '<span class="unit">' + esc(f.unit) + "</span>" : "") +
        (exam.beantwortet ? "" : '<button class="btn" data-act="examNum" type="button">Prüfen</button>') +
        "</div>";
    } else {
      html += '<div class="exopts">' + f.a.map(function (opt, i) {
        var cls = "exopt";
        if (exam.beantwortet) {
          if (i === f.k) cls += " right";
          else if (i === exam.gewaehlt) cls += " wrong";
          else cls += " dim";
        }
        return '<button class="' + cls + '" data-act="examPick" data-i="' + i + '" type="button"' +
          (exam.beantwortet ? " disabled" : "") + ">" + esc(opt) + "</button>";
      }).join("") + "</div>";
    }

    if (exam.beantwortet) {
      var richtig = exam.zuletztRichtig;
      html += '<div class="exwhy ' + (richtig ? "ok" : "no") + '">' +
        "<b>" + (richtig ? "Richtig" : "Falsch") + "</b> " + esc(f.why) +
        (f.t === "num" && !richtig ? " <b>Lösung: " + f.a + (f.unit ? " " + esc(f.unit) : "") + "</b>" : "") +
        "</div>" +
        '<div class="exbtns"><button class="btn" data-act="examNext" type="button">' +
        (exam.i + 1 >= n ? "Ergebnis" : "Weiter") + "</button></div>";
    }
    if (QUIZ_VORLAEUFIG) {
      html += '<p class="exnote">Vorläufiger Fragenkatalog aus der offiziellen ' +
        "Prüfungsstruktur — wird gegen deine eigenen Schulaufgaben getauscht.</p>";
    }
    box.innerHTML = html;
    var inp = document.getElementById("exNum");
    if (inp && !exam.beantwortet) inp.focus();
  }

  function antwort(richtig, gewaehlt) {
    exam.beantwortet = true;
    exam.zuletztRichtig = richtig;
    exam.gewaehlt = gewaehlt;
    if (richtig) exam.richtig++;
    zeigeExam();
  }

  /* ---- Fokus-Timer -------------------------------------------------------
     Vertrag wortgleich mit dem Mac-Widget: t = { key, id, nm, mins, start },
     null wenn keiner läuft. Ein dort gestarteter Block läuft deshalb hier
     weiter — es ist derselbe Schlüssel in derselben Datei.

     Der Sekundentakt schreibt bewusst nichts: er beschriftet nur die Anzeige
     neu. Ginge er über save(), löste jede Sekunde eine Veröffentlichung aus.  */
  var PAUSE_ID = "__pause";
  var geklungen = null, weckerText = "", weckerAn = false, letzteLage = "";

  function timerLeft(t, nowMs) {
    if (!t || !t.start || !t.mins) return null;
    return Math.ceil((t.start + t.mins * 60000 - nowMs) / 60000);
  }
  function timerSek(t, nowMs) {
    if (!t || !t.start || !t.mins) return null;
    return Math.max(0, Math.round((t.start + t.mins * 60000 - nowMs) / 1000));
  }
  function uhrzeit(sek) {
    return Math.floor(sek / 60) + ":" + pad(sek % 60);
  }

  function timerStart(b, key) {
    // Beides gehört in den Fingertipp: nur hier darf der Ton freigeschaltet
    // werden, und nur hier fragt der Browser nach der Benachrichtigung.
    audioWecken();
    weckerErlauben();
    state.t = { key: key, id: b.id, nm: b.nm, mins: minutes(b) || 25, start: Date.now() };
    geklungen = null;
    weckerStellen();
    save(); render();
    sag("Fokus gestartet: " + b.nm + ", " + state.t.mins + " Minuten.");
  }
  function timerStop() {
    state.t = null; geklungen = null;
    toeneAbbrechen();
    nachholen = false;   // save() darf jetzt wieder raus
    save(); render(); sag("Timer beendet.");
  }
  function timerPlus(schritt) {
    if (!state.t) return;
    var t = state.t;
    state.t = { key: t.key, id: t.id, nm: t.nm, mins: t.mins + (schritt || 10), start: t.start };
    geklungen = null;
    weckerStellen();
    save(); render();
  }
  function pauseStart() {
    audioWecken();
    weckerErlauben();
    state.t = { key: ymd(today()), id: PAUSE_ID, nm: "Pause", mins: 5, start: Date.now() };
    geklungen = null;
    weckerStellen();
    save(); render();
  }

  /* ---- Der Wecker --------------------------------------------------------
     Entscheidend ist, WANN der Ton entsteht. Vorher wurde er im Moment des
     Ablaufs erzeugt — in einem setInterval-Rückruf, den der Browser bei einem
     Tab im Hintergrund auf einmal pro Minute bremst und auf dem Handy ganz
     einfriert. Dazu darf ein frisch erzeugter AudioContext ausserhalb eines
     Fingertipps meist gar nicht loslegen. Beides zusammen ergab: zu spät oder
     stumm.

     Jetzt entsteht der Klang beim Start, innerhalb des Tippens auf ▶, und wird
     in der Audio-Uhr auf die Endzeit vorgelegt. Die läuft im Audio-Thread und
     kümmert sich nicht darum, ob der Tab gerade im Vordergrund ist.
     Der Sekundentakt bleibt für das Sichtbare zuständig — zwei Wege, von denen
     jeder allein trägt.                                                      */
  var AUDIO = null;             // ein einziger Kontext, im Fingertipp geweckt
  var gelegt = [];              // vorgelegte Töne, zum Abbrechen
  var VORLAUF_MAX = 2 * 3600;   // weiter voraus hält kein Browser den Kontext

  function audioWecken() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!AUDIO) AUDIO = new AC();
      if (AUDIO.state === "suspended" && AUDIO.resume) AUDIO.resume();
      return AUDIO;
    } catch (e) { return null; }
  }
  /*  Drei Schübe zu je drei Tönen über zehn Sekunden — das überhört man nicht,
      und der Knopf "verstanden" bricht es ab.                                */
  function tonLegen(abSek) {
    var ctx = AUDIO;
    if (!ctx) return;
    toeneAbbrechen();
    var basis = ctx.currentTime + Math.max(0, abSek);
    [0, 5, 10].forEach(function (schub) {
      [0, 0.22, 0.44].forEach(function (dt) {
        try {
          var o = ctx.createOscillator(), g = ctx.createGain();
          var t0 = basis + schub + dt;
          o.type = "sine";
          o.frequency.value = 880;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.17);
          o.connect(g); g.connect(ctx.destination);
          o.start(t0); o.stop(t0 + 0.2);
          gelegt.push(o);
        } catch (e) { /* einer weniger, der Rest klingt */ }
      });
    });
  }
  function toeneAbbrechen() {
    gelegt.forEach(function (o) {
      try { o.stop(); o.disconnect(); } catch (e) { /* lief schon ab */ }
    });
    gelegt = [];
  }
  /*  Für den laufenden Timer vorlegen — beim Start und beim Verlängern.      */
  function weckerStellen() {
    if (!AUDIO || !state.t) { toeneAbbrechen(); return; }
    var sek = (state.t.start + state.t.mins * 60000 - Date.now()) / 1000;
    if (sek < 0 || sek > VORLAUF_MAX) { toeneAbbrechen(); return; }
    tonLegen(sek);
  }

  function weckerErlauben() {
    try {
      if (window.Notification && window.Notification.permission === "default") {
        window.Notification.requestPermission();
      }
    } catch (e) { /* nicht verfügbar — der Ton in der Seite reicht */ }
  }
  /*  Ob eine Benachrichtigung durchkommt, entscheidet der Rahmen, in dem das
      Artefakt steckt — oft ist sie gesperrt. Das gehört gesagt statt gehofft. */
  function meldeLage() {
    try {
      if (!window.Notification) return "Benachrichtigung hier nicht möglich — der Ton weckt dich";
      if (window.Notification.permission === "granted") return "Benachrichtigung erlaubt";
      if (window.Notification.permission === "denied") return "Benachrichtigung gesperrt — der Ton weckt dich";
      return "Benachrichtigung noch nicht erlaubt — der Ton weckt dich";
    } catch (e) { return "Benachrichtigung hier nicht möglich — der Ton weckt dich"; }
  }

  function klingeln(t) {
    var pause = t.id === PAUSE_ID;
    var titel = pause ? "Pause vorbei" : "Fokusblock fertig";
    var text = pause ? "Weiter geht es." : t.nm + " · " + t.mins + " Minuten geschafft.";
    weckerText = titel + " — " + text;
    // Das Banner bleibt stehen, bis es weggeklickt wird. Ein Wecker, den man
    // verschlafen kann, ist keiner.
    weckerAn = true;
    // Ist nichts vorgelegt — kein Audio, zu langer Vorlauf, Seite zwischendurch
    // neu geladen —, wird hier noch einmal versucht.
    if (!gelegt.length) { audioWecken(); tonLegen(0); }
    sag(titel + ". " + text);
    try {
      if (window.Notification && window.Notification.permission === "granted") {
        new window.Notification(titel, { body: text });
      }
    } catch (e) { /* dann eben nur in der Seite */ }
  }
  function weckerZurueck() {
    weckerAn = false; weckerText = "";
    toeneAbbrechen();
    render();
    // Was der Wecker aufgehalten hat, geht jetzt raus.
    if (nachholen) { nachholen = false; save(); }
  }

  /*  Ein Takt für beides: die Timeranzeige jede Sekunde, und ein Blick darauf,
      ob inzwischen ein anderer Block dran ist. Neu gezeichnet wird nur, wenn
      sich die Lage wirklich ändert — sonst ein paar Mal am Tag statt 86.400.  */
  function takt() {
    var t = state.t;
    if (t) {
      var sek = timerSek(t, Date.now());
      var token = t.key + "|" + t.id + "|" + t.start + "|" + t.mins;
      if (sek <= 0) {
        if (geklungen !== token) {
          geklungen = token;
          klingeln(t);
          state.t = null;
          save(); render();
        }
      } else {
        var el = document.getElementById("tuhr");
        if (el) el.textContent = uhrzeit(sek);
      }
    }
    // Der Wecker verschwindet nur auf Knopfdruck. Die Aufstiegsmeldung darf
    // von allein gehen — sie verlangt nichts.
    if (aufstiegBis && Date.now() > aufstiegBis) { aufstiegBis = 0; aufstiegText = ""; render(); }
    lagePruefen();
  }
  function lagePruefen() {
    if (view !== 0) return;
    var info = dayInfo(today(), state.f);
    var lg = tagesLage(info.plan, jetztMin());
    var sig = (lg.jetzt ? lg.jetzt.b.id : "-") + "/" + (lg.naechst ? lg.naechst.b.id : "-");
    if (letzteLage && sig !== letzteLage) render();
  }

  /* ---- Ansicht ---------------------------------------------------------- */
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12); }
  function shownDate() { return addDays(today(), view); }

  /* ---- Notenkarte -------------------------------------------------------
     Eintragen, Schnitt sehen — und die einzige Zahl, die etwas ändert: welcher
     Schnitt in den offenen Prüfungsblöcken für das Ziel noch nötig ist.      */
  var gForm = { fach: "", was: "", n: "", p: "", dat: "", gew: "1" };
  var gMsg = null;
  /*  Jedes Eingabefeld braucht seinen Entwurf: render() ersetzt das DOM, und
      ohne diese Zwischenspeicher wäre Getipptes beim nächsten Klick weg.
      Notiz und Schwerpunkte hängen am Tag bzw. an der Woche — sonst zeigte ein
      Tageswechsel den Entwurf des vorigen Tages.                             */
  var notizEntwurf = null;    // { key, text }
  var themenEntwurf = null;   // { key, text }
  var ioEntwurf = null;       // Zeichenkette oder null für "aus dem Zustand"
  var monatOffset = 0;        // 0 = aktueller Monat, negativ = zurückgeblättert

  function fachName(id) {
    var f = String(id);
    if (f.indexOf("ihk:") === 0) {
      var b = IHK_BLOECKE.filter(function (x) { return "ihk:" + x.id === f; })[0];
      return b ? b.nm : f;
    }
    if (f.indexOf("zg:") === 0) {
      var z = ZEUGNIS.filter(function (x) { return "zg:" + x.id === f; })[0];
      return z ? "Zeugnis · " + z.nm : f;
    }
    return ATTR_BY[id] ? ATTR_BY[id].nm : id;
  }

  /*  Der Hinweis unter dem Formular zeigt die jeweils andere Zahl, bevor
      eingetragen wird — so sieht man den Schlüssel, statt ihm zu vertrauen.  */
  function gHinweis() {
    if (gMsg) return gMsg;
    var nt = gForm.n === "" ? null : Number(gForm.n);
    var pk = gForm.p === "" ? null : Number(gForm.p);
    if (nt !== null && isFinite(nt) && (pk === null || !isFinite(pk))) {
      return "Note " + num(nt) + " entspricht ungefähr " + noteZuPunkte(nt) + " Punkten.";
    }
    if (pk !== null && isFinite(pk) && (nt === null || !isFinite(nt))) {
      var abg = punkteZuNote(pk);
      return pk + " Punkte sind nach dem IHK-Schlüssel Note " + abg + " (" + notenName(abg) + ").";
    }
    return "Note oder Punkte reichen — die andere Zahl rechnet die Seite aus. " +
           "Schlüssel: ab 92 Punkte Note 1, ab 81 Note 2, ab 67 Note 3, ab 50 Note 4, ab 30 Note 5.";
  }

  function ptile(titel, wert, unten, cls) {
    return '<div class="pt ' + cls + '"><span class="eyebrow">' + esc(titel) + "</span>" +
      '<span class="pv mono">' + esc(wert) + '</span><span class="pc">' + esc(unten) + "</span></div>";
  }

  function notenKarte(now) {
    var gl = state.g || [];
    var ziel = state.zn || 1.9;
    // Eine Zeugnisnote ist bereits ein Mittel. Zählte sie hier mit, ginge
    // dieselbe Leistung ein zweites Mal in den Schnitt ein.
    var schule = gl.filter(function (e) { return !istIhk(e) && !istZeugnis(e); });
    var ges = schnitt(schule);

    var h = '<section class="card"><div class="card-head"><h2>Noten</h2>' +
      '<span class="note mono">' +
      (ges === null ? "noch nichts eingetragen"
        : "Schnitt Schule " + num(ges, 2) + " · " + schule.length +
          (schule.length === 1 ? " Note" : " Noten")) + "</span></div>";

    /* Eingabe */
    h += '<div class="gform">' +
      '<label class="gf f-fach"><span>Fach</span><select id="gFach">' +
      '<option value="">bitte wählen</option><optgroup label="Schule">' +
      GEPRUEFT.map(function (id) {
        return '<option value="' + id + '"' + (gForm.fach === id ? " selected" : "") +
          ">" + esc(ATTR_BY[id].nm) + "</option>";
      }).join("") + '</optgroup><optgroup label="IHK-Prüfung">' +
      IHK_BLOECKE.map(function (b) {
        var v = "ihk:" + b.id;
        return '<option value="' + v + '"' + (gForm.fach === v ? " selected" : "") +
          ">" + esc(b.nm) + "</option>";
      }).join("") + '</optgroup><optgroup label="Berufsschulzeugnis">' +
      ZEUGNIS.map(function (z) {
        var v = "zg:" + z.id;
        return '<option value="' + v + '"' + (gForm.fach === v ? " selected" : "") +
          ">" + esc(z.nm) + "</option>";
      }).join("") + "</optgroup></select></label>" +
      '<label class="gf f-was"><span>Was</span><input id="gWas" type="text" maxlength="80" ' +
      'placeholder="Klassenarbeit Buchführung" value="' + esc(gForm.was) + '"></label>' +
      '<label class="gf f-n"><span>Note</span><input id="gNote" type="number" step="0.1" ' +
      'min="1" max="6" inputmode="decimal" placeholder="2,0" value="' + esc(gForm.n) + '"></label>' +
      '<label class="gf f-p"><span>Punkte</span><input id="gPkt" type="number" step="1" ' +
      'min="0" max="100" inputmode="numeric" placeholder="83" value="' + esc(gForm.p) + '"></label>' +
      '<label class="gf f-d"><span>Datum</span><input id="gDat" type="date" value="' +
      esc(gForm.dat || ymd(now)) + '"></label>' +
      '<label class="gf f-g"><span>Gewicht</span><select id="gGew">' +
      [["0.5", "×0,5 klein"], ["1", "×1 normal"], ["2", "×2 Klassenarbeit"], ["3", "×3 Abschluss"]]
        .map(function (o) {
          return '<option value="' + o[0] + '"' + (gForm.gew === o[0] ? " selected" : "") +
            ">" + o[1] + "</option>";
        }).join("") + "</select></label>" +
      '<button class="btn prim f-b" data-act="gadd" type="button">' + icon("plus", 15) +
      "Eintragen</button></div>" +
      '<p class="gtip note' + (gMsg ? " bad" : "") + '" id="gtip">' + esc(gHinweis()) + "</p>";

    /* Eingetragene Noten, neueste zuerst */
    if (gl.length) {
      var sorted = gl.slice().sort(function (a, b) {
        var x = a.dat || "", y = b.dat || "";
        return x < y ? 1 : x > y ? -1 : 0;
      });
      h += '<ul class="glist">' + sorted.map(function (e) {
        var nt = Number(e.n);
        var fn = fachName(e.fach);
        var titel = e.was || fn;
        // Nebenzeile aus Teilen bauen: das Fach nur, wenn es nicht schon oben steht.
        var teile = [];
        if (fn !== titel) teile.push(esc(fn));
        // Für eine Zeugnisnote ist der IHK-Punkteschlüssel bedeutungslos: die
        // Schule rechnet nicht danach. Dann steht dort nur, was eingetragen wurde.
        if (e.p !== null && e.p !== undefined) teile.push(e.p + " Punkte");
        else if (!istZeugnis(e)) teile.push("≈ " + noteZuPunkte(e.n) + " Punkte");
        if (Number(e.gew) !== 1) teile.push("×" + String(e.gew).replace(".", ","));
        if (e.dat) teile.push(e.dat.split("-").reverse().join("."));
        return '<li class="gitem' + (nt >= 4.5 ? " bad" : nt <= 2 ? " good" : "") + '">' +
          '<span class="gn mono">' + num(nt) + "</span>" +
          '<span class="gb"><span class="gw">' + esc(titel) + "</span>" +
          '<span class="gm mono">' + teile.join(" · ") + "</span></span>" +
          '<button class="gdel" data-act="gdel" data-id="' + esc(e.id) + '" type="button" ' +
          'aria-label="' + esc(titel) + ' löschen">' + icon("trash", 15) +
          "</button></li>";
      }).join("") + "</ul>";
    }

    /* Schnitt je Fach */
    h += '<div class="gavg">' + GEPRUEFT.map(function (id) {
      var list = gl.filter(function (e) { return e.fach === id; });
      var sc = schnitt(list);
      return '<div class="ga' + (sc === null ? " empty" : sc > 3.4 ? " bad" : sc <= 2 ? " good" : "") + '">' +
        '<span class="gan">' + esc(ATTR_BY[id].nm) + "</span>" +
        '<span class="gav mono">' + (sc === null ? "—" : num(sc, 2)) + "</span>" +
        '<span class="gac mono">' + (list.length
          ? list.length + (list.length === 1 ? " Note" : " Noten") : "offen") +
        "</span></div>";
    }).join("") + "</div>";

    /* Zeugnis */
    var zl = gl.filter(istZeugnis);
    var zSchnitt = schnitt(zl);
    h += '<div class="zeug"><div class="proghead">' +
      '<span class="eyebrow">Berufsschulzeugnis</span>' +
      '<span class="note mono">' +
      (zSchnitt === null ? "noch nichts eingetragen" : "Schnitt " + num(zSchnitt, 2)) +
      "</span></div>";
    if (zl.length) {
      h += '<ul class="pbl">' + ZEUGNIS.map(function (z) {
        var treffer = zl.filter(function (e) { return e.fach === "zg:" + z.id; });
        if (!treffer.length) return "";
        // Bei der BFK zur Gegenprobe: was ergeben die eigenen Klassenarbeiten
        // aus BWL, WiSo und SUK? Weicht das ab, gewichtet die Schule anders.
        var eigen = z.ausF ? schnitt(gl.filter(function (e) {
          return z.ausF.indexOf(e.fach) >= 0;
        })) : null;
        var unten = [];
        if (z.de) unten.push(esc(z.de));
        if (eigen !== null) unten.push("deine Klassenarbeiten ergeben " + num(eigen, 2));
        return '<li class="pb have">' +
          '<span class="pbn">' + esc(z.nm) +
          (unten.length ? "<em>" + unten.join(" · ") + "</em>" : "") + "</span>" +
          '<span class="pbv mono">' + num(schnitt(treffer)) + "</span></li>";
      }).join("") + "</ul>" +
        '<p class="note tiny">Je Zeile eine Note, gleich gewichtet — so steht es auf ' +
        "dem Zeugnis. Diese Rechnung ist unabhängig von der IHK-Prognose darunter: " +
        "das Weiterbildungsstipendium hängt an der Abschlussprüfung, nicht am " +
        "Berufsschulzeugnis.</p>";
    } else {
      h += '<p class="note tiny">Noch keine Zeugnisnote eingetragen. Oben im Feld ' +
        "<em>Fach</em> stehen sie unter <em>Berufsschulzeugnis</em> — BWL, WiSo und " +
        "SUK zusammen als Berufsfachliche Kompetenz.</p>";
    }
    h += "</div>";

    /* Prognose */
    var pr = prognose(gl, ziel);
    h += '<div class="prog"><div class="proghead">' +
      '<span class="eyebrow">Prognose Abschlussnote</span>' +
      '<label class="gziel">Ziel <input id="gZiel" type="number" step="0.1" min="1" max="4" ' +
      'value="' + String(ziel) + '"></label></div>';
    h += '<div class="pgrid">' +
      ptile("aktuell", pr.aktuell === null ? "—" : num(pr.aktuell, 2),
            pr.gewBekannt ? pr.gewBekannt + " % der Note stehen" : "noch kein Block eingetragen", "") +
      ptile("bestenfalls", num(pr.best, 2), "offene Blöcke mit 1,0", "good") +
      ptile("schlechtestenfalls", num(pr.schlecht, 2), "offene Blöcke mit 6,0", "bad") +
      "</div>";
    h += '<ul class="pbl">' + IHK_BLOECKE.map(function (b) {
      var hit = pr.bekannt.filter(function (x) { return x.b.id === b.id; })[0];
      return '<li class="pb' + (hit ? " have" : "") + '">' +
        '<span class="pbn">' + esc(b.nm) + "<em>" + esc(b.de) + "</em></span>" +
        '<span class="pbp mono">' + b.pct + " %</span>" +
        '<span class="pbv mono">' + (hit ? num(hit.n, 2) : "offen") + "</span></li>";
    }).join("") + "</ul>";

    var satz;
    if (!pr.gewOffen) {
      satz = "Alle vier Blöcke sind eingetragen — die Note steht bei " + num(pr.best, 2) + ".";
    } else if (pr.noetig === null) {
      satz = "";
    } else if (pr.noetig < 1) {
      satz = "Ziel " + num(ziel) + " ist rechnerisch nicht mehr zu schaffen: selbst mit 1,0 in " +
             "allen offenen Blöcken kommst du auf " + num(pr.best, 2) + ".";
    } else if (pr.noetig >= 6) {
      satz = "Ziel " + num(ziel) + " steht bereits fest — auch im schlechtesten Fall (" +
             num(pr.schlecht, 2) + ") bleibst du darunter.";
    } else {
      satz = "Für " + num(ziel) + " brauchst du in den offenen Blöcken (" + pr.gewOffen +
             " % der Note) im Schnitt " + num(pr.noetig, 2) + ".";
    }
    if (satz) h += '<p class="pnote">' + esc(satz) + "</p>";
    h += '<p class="note tiny">1,9 ist die Schwelle fürs Weiterbildungsstipendium. ' +
      "Gewichte: Teil 1 25 %, Geschäftsprozesse 35 %, Wirtschafts- und Sozialkunde 10 %, " +
      "Fachaufgabe 30 % — die Aufteilung der schriftlichen Bereiche bei deiner IHK gegenprüfen " +
      "und im Quelltext anpassen.</p></div></section>";
    return h;
  }

  /*  Eintragen. Fehlt eine der beiden Zahlen, wird sie aus der anderen
      gerechnet; fehlen beide, passiert nichts ausser einem Hinweis.          */
  function noteEintragen() {
    var fach = gForm.fach;
    if (!fach) { gMsg = "Erst ein Fach wählen."; render(); return; }
    var nt = gForm.n === "" ? null : Number(gForm.n);
    var pk = gForm.p === "" ? null : Number(gForm.p);
    if ((nt === null || !isFinite(nt)) && (pk === null || !isFinite(pk))) {
      gMsg = "Eine Note oder eine Punktzahl eintragen."; render(); return;
    }
    if (nt !== null && isFinite(nt) && (nt < 1 || nt > 6)) {
      gMsg = "Noten gehen von 1,0 bis 6,0."; render(); return;
    }
    if (pk !== null && isFinite(pk) && (pk < 0 || pk > 100)) {
      gMsg = "Punkte gehen von 0 bis 100."; render(); return;
    }
    // Gespeichert wird nur, was wirklich eingetragen wurde. Die andere Zahl
    // rechnet die Anzeige aus und schreibt ein Zirka davor — sonst sähe eine
    // geschätzte Punktzahl später aus wie eine gemessene.
    var hatNote = nt !== null && isFinite(nt);
    var eintrag = {
      id: "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      fach: fach, was: gForm.was.trim(),
      n: hatNote ? Math.round(Number(nt) * 10) / 10 : punkteZuNote(pk),
      p: pk !== null && isFinite(pk) ? Math.round(Number(pk)) : null,
      dat: gForm.dat || ymd(today()), gew: Number(gForm.gew) || 1
    };
    state.g = (state.g || []).concat([eintrag]);
    // Fach und Gewicht bleiben stehen — meist kommen mehrere Noten am Stück.
    gForm.was = ""; gForm.n = ""; gForm.p = "";
    gMsg = null;
    save(); render();
    var el = document.getElementById("gWas");
    if (el) el.focus();
  }

  /*  Steigt eine Stufe, ändert sich sonst lautlos eine Zahl. Beim ersten
      Zeichnen wird nur gemerkt, nicht gemeldet — sonst gratulierte die Seite
      beim Öffnen zu allem, was längst erreicht ist.                          */
  var standZuvor = null, aufstiegText = "", aufstiegBis = 0;
  function aufstiegPruefen(ev, rank) {
    var jetzt = { rang: rank.level, attr: {} };
    ATTRS.forEach(function (a) {
      jetzt.attr[a.id] = standOf(a.id, ev.attrXp[a.id] || 0).level;
    });
    if (!standZuvor) { standZuvor = jetzt; return null; }
    var texte = [];
    if (jetzt.rang > standZuvor.rang) texte.push("Stufe " + jetzt.rang + " · " + rank.name);
    ATTRS.forEach(function (a) {
      if (jetzt.attr[a.id] > standZuvor.attr[a.id]) {
        texte.push(a.nm + " auf Stufe " + jetzt.attr[a.id]);
      }
    });
    standZuvor = jetzt;
    return texte.length ? texte.join(" · ") : null;
  }

  var lastEv = null;
  function render() {
    var fok = fokusMerken();
    var now = today(), shown = shownDate();
    var info = dayInfo(shown, state.f);
    var ids = state.d[info.key] || [];
    var ev = auswerten(state, now); lastEv = ev;
    var heutePlan = view === 0 ? info.plan : dayInfo(now, state.f).plan;
    var lage = tagesLage(heutePlan, jetztMin());
    letzteLage = (lage.jetzt ? lage.jetzt.b.id : "-") + "/" +
                 (lage.naechst ? lage.naechst.b.id : "-");
    var wk = weekStats(state, now);
    var rank = rankOf(ev.xp);
    var exam = nextExam(now);
    var bl = scored(info.plan);
    var hit = bl.filter(function (b) { return ids.indexOf(b.id) >= 0; }).length;
    var kern = coreDone(info.plan, ids), voll = allDone(info.plan, ids);

    var auf = aufstiegPruefen(ev, rank);
    if (auf) { aufstiegText = auf; aufstiegBis = Date.now() + 20000; sag("Aufstieg: " + auf); }

    var levelPct = rank.to ? Math.round(((ev.xp - rank.from) / (rank.to - rank.from)) * 100) : 100;
    var goalPct = wk.goal ? Math.min(100, Math.round((wk.done / wk.goal) * 100)) : 0;
    var quote = ev.counted ? Math.round((ev.coreDays / ev.counted) * 100) : 0;

    var html = "";

    /* Kopf */
    html += '<div class="top"><div>' +
      "<h1>Lernquest</h1>" +
      '<div class="sub">Dein Berichtsheft bis zur IHK-Prüfung — abstempeln, was steht.</div>' +
      "</div><div class=\"tools\">" +
      '<button class="btn ghost" data-act="theme" type="button" aria-label="Zwischen hell und dunkel wechseln">' +
      icon("moon") + "Ansicht</button></div></div>";

    /* Instrumente */
    html += '<div class="gauges">';
    html += '<div class="gauge amber"><div class="eyebrow">Stufe ' + rank.level + "</div>" +
      '<div class="val mono">' + ev.xp.toLocaleString("de-DE") + '<small>XP</small></div>' +
      '<div class="bar"><i style="width:' + levelPct + '%"></i></div>' +
      '<div class="cap">' + esc(rank.name) +
      (rank.to ? " · noch " + (rank.to - ev.xp).toLocaleString("de-DE") + " bis " + esc(rank.next) : " · Endstufe") +
      "</div></div>";
    html += '<div class="gauge mint"><div class="eyebrow">Kern-Serie</div>' +
      '<div class="val mono">' + ev.streak + '<small>' + (ev.streak === 1 ? "Tag" : "Tage") + "</small></div>" +
      '<div class="cap">Multiplikator ×' + String(multiplier(ev.streak)).replace(".", ",") +
      " · Bestwert " + ev.best + "</div></div>";
    html += '<div class="gauge"><div class="eyebrow">Diese Woche</div>' +
      '<div class="val mono">' + fmtMin(wk.done) + "</div>" +
      '<div class="bar blue"><i style="width:' + goalPct + '%"></i></div>' +
      '<div class="cap">Ziel ' + fmtMin(wk.goal) + " · " + goalPct + " %</div></div>";
    if (exam) {
      html += '<div class="gauge coral"><div class="eyebrow">' + esc(exam.label) + "</div>" +
        '<div class="val mono">' + exam.days + '<small>Tage</small></div>' +
        '<div class="cap">Kern an ' + quote + " % deiner Lerntage</div></div>";
    }
    html += "</div>";

    // Die Ansage ist unsichtbar und trägt jede Rückmeldung an Screenreader.
    html += '<div id="ansage" class="sr" role="status" aria-live="polite"></div>';

    if (aufstiegText && aufstiegBis > Date.now()) {
      html += '<div class="aufstieg"><span class="ic">' + icon("star", 18) + "</span>" +
        "<span><b>Aufstieg</b> " + esc(aufstiegText) + "</span></div>";
    }
    if (weckerAn && weckerText) {
      html += '<div class="wecker" role="alert"><span class="ic">' + icon("bell", 18) + "</span>" +
        "<span>" + esc(weckerText) + "</span>" +
        '<button class="btn" data-act="weckerAus" type="button">verstanden</button></div>';
    }
    var rb = rueckBereit();
    if (rb) {
      html += '<div class="undobar" id="undobar"><span>' + esc(rb) + "</span>" +
        '<button class="btn" data-act="undo" type="button">' + icon("undo", 14) +
        "Rückgängig</button></div>";
    }

    html += '<div class="stack" style="margin-top:18px">';

    /* Heute */
    var chips = '<span class="chip">' + esc(info.plan.tag) + "</span>";
    if (info.label) chips += '<span class="chip free">' + esc(info.label) + "</span>";
    if (info.plan.hot) chips += '<span class="chip hot">Schwerer Tag</span>';
    if (info.plan.rest) chips += '<span class="chip rest">Erholung eingeplant</span>';

    html += '<section class="card"><div class="card-head"><div>' +
      '<div class="eyebrow">' + (view === 0 ? "Heute" : view === -1 ? "Gestern"
        : "Nachtrag · " + Math.abs(view) + " Tage zurück") + "</div>" +
      "<h2>" + esc(info.plan.label) + ", " + pad(shown.getDate()) + "." + pad(shown.getMonth() + 1) + ".</h2>" +
      '<div class="row" style="margin-top:7px">' + chips + "</div>" +
      '<div class="note" style="margin-top:6px">' + esc(info.plan.note || "") + "</div>" +
      '</div><div class="tools">' +
      // Steht man nicht auf heute, ist der Rückweg ein Klick — nicht sieben.
      (view !== 0
        ? '<button class="btn back" data-act="today" type="button">' + icon("sun", 14) + "heute</button>"
        : "") +
      '<button class="btn" data-act="prev" type="button" aria-label="Tag zurück">‹</button>' +
      '<button class="btn" data-act="next" type="button" aria-label="Tag vor"' +
      (view >= 0 ? " disabled" : "") + ">›</button>" +
      '<button class="btn" data-act="mark" type="button">' +
      (info.kind === "sick" ? "krank" : info.kind === "off" ? "frei" : "frei setzen") +
      "</button></div></div>";

    // Solange Teil 1 aussteht, gilt für jede Aufgabe derselbe Stoffzuschnitt.
    if (PLAN.focus && ymd(now) < PLAN.focusBis) {
      html += '<div class="focus"><span class="eyebrow">Bis Teil 1</span><span>' +
        esc(PLAN.focus) + "</span></div>";
    }

    // Was gerade dran ist, steht nur am heutigen Tag an — im Nachtrag wäre es
    // eine Behauptung über einen Tag, der längst vorbei ist.
    if (view === 0 && info.counts && (lage.jetzt || lage.naechst)) {
      html += '<div class="jetztzeile">' +
        (lage.jetzt
          ? '<span class="eyebrow">Jetzt</span><span class="jn">' + esc(lage.jetzt.b.nm) + "</span>"
          : '<span class="eyebrow">Gleich</span>') +
        (lage.naechst
          ? '<span class="jnext">als Nächstes um ' + esc(lage.naechst.b.t) + ": " +
            esc(lage.naechst.b.nm) + "</span>"
          : '<span class="jnext">danach ist der Tag durch</span>') +
        "</div>";
    }

    html += '<ul class="quests">';
    (info.plan.blocks || []).forEach(function (b) {
      var on = ids.indexOf(b.id) >= 0;
      var track = !!b.track;
      var isCore = PLAN.core.indexOf(b.id) >= 0 && track && !b.opt;
      var dauer = minutes(b);
      var laeuft = !!(state.t && state.t.id === b.id && state.t.key === info.key);
      var istJetzt = view === 0 && info.counts && lage.jetzt && lage.jetzt.b.id === b.id;
      html += '<li class="quest' + (on ? " done" : "") + (track ? "" : " fix") +
        (isCore ? " kern" : "") + (istJetzt ? " jetzt" : "") + (laeuft ? " laeuft" : "") +
        '" data-id="' + esc(b.id) + '">' +
        '<span class="time mono">' + esc(b.t) + "</span>" +
        '<span class="body"><span class="nm">' + esc(b.nm) + "</span>" +
        (b.sub ? '<span class="sb">' + esc(b.sub) + "</span>" : "") +
        // Die ausführliche Anleitung steht nur an, solange der Block offen ist.
        (b.det && !on ? '<span class="dtl">' + esc(b.det) + "</span>" : "") +
        (track && attrsOf(info.dk, b).length
          ? '<span class="atag mono">' + attrsOf(info.dk, b).map(function (id) {
              return esc(ATTR_BY[id].nm);
            }).join(" + ") + "</span>"
          : "") + "</span>" +
        '<span class="xp mono">' + (track ? (on ? "+" : "") + blockXp(b) + " XP" : "") + "</span>" +
        (laeuft
          ? '<span class="tlauf mono" id="tuhr" aria-label="verbleibende Zeit">' +
            uhrzeit(timerSek(state.t, Date.now()) || 0) + "</span>" +
            '<button class="tbtn stop" data-act="tstop" type="button" ' +
            'aria-label="Timer beenden">■</button>'
          : track && dauer > 0 && !on
            ? '<button class="tbtn" data-act="tstart" data-id="' + esc(b.id) + '" type="button" ' +
              'aria-label="Fokus-Timer für ' + esc(b.nm) + " starten, " + dauer +
              ' Minuten">▶</button>'
            : '<span class="tbtn leer" aria-hidden="true"></span>') +
        (track
          ? '<button class="stampbox" data-act="toggle" data-id="' + esc(b.id) + '" type="button" ' +
            'aria-pressed="' + (on ? "true" : "false") + '" aria-label="' + esc(b.nm) + ' abstempeln">' +
            icon("check", 16) + "</button>"
          : '<span class="stampbox" aria-hidden="true"></span>') +
        "</li>";
    });
    html += "</ul>";

    html += '<div class="row" style="margin-top:14px; justify-content:space-between">' +
      '<span class="note mono">' + hit + " von " + bl.length + " · " +
      (info.counts ? "zählt" : "zählt nicht") + "</span>";
    if (!info.counts) html += '<span class="stamp rest">Ruhetag</span>';
    else if (voll) html += '<span class="stamp done">Reinen Tisch</span>';
    else if (kern) html += '<span class="stamp saved">Tag gerettet</span>';
    else {
      // Der Sammelknopf steht genau dort, wo das Problem benannt wird.
      html += '<span class="row"><span class="note">Kern offen: ' +
        coreIds(info.plan).filter(function (id) { return ids.indexOf(id) < 0; }).join(" · ") +
        "</span>" +
        '<button class="btn small" data-act="kern" type="button">Kern \u2713</button></span>';
    }
    html += "</div>";

    // Tagesnotiz — derselbe Schlüssel, den auch das Mac-Widget beschreibt.
    var notizWert = notizEntwurf && notizEntwurf.key === info.key
      ? notizEntwurf.text : (state.n[info.key] || "");
    html += '<div class="tagnotiz"><label class="eyebrow" for="notiz">Notiz</label>' +
      '<input id="notiz" type="text" maxlength="280" value="' + esc(notizWert) + '" ' +
      'placeholder="was lief heute, was ging schief — ein Satz genügt">' +
      "</div>";

    /*  Die Timerleiste steht am heutigen Tag immer da — sie ist zugleich die
        Stelle, an der ehrlich steht, ob eine Benachrichtigung durchkommt.
        Läuft der Timer auf einem Block dieses Tages, zeigt schon dessen Zeile
        die Uhr; dann darf hier keine zweite mit derselben Kennung stehen.     */
    if (view === 0 || state.t) {
      var tImPlan = state.t && (info.plan.blocks || []).some(function (b) {
        return b.id === state.t.id && state.t.key === info.key;
      });
      html += '<div class="tfremd">';
      if (state.t) {
        html += '<span class="eyebrow">Läuft</span><span>' + esc(state.t.nm) + "</span>" +
          (tImPlan ? "" : '<span class="tlauf mono" id="tuhr">' +
            uhrzeit(timerSek(state.t, Date.now()) || 0) + "</span>") +
          '<span class="note tstat">' + esc(meldeLage()) + "</span>" +
          '<button class="btn small" data-act="tplus" type="button">+10 min</button>' +
          '<button class="btn small" data-act="tstop" type="button">beenden</button>';
      } else {
        html += '<span class="eyebrow">Pause</span>' +
          '<span class="note">Fünf Minuten zwischen zwei Blöcken — der Wecker holt dich zurück.</span>' +
          '<span class="note tstat">' + esc(meldeLage()) + "</span>" +
          '<button class="btn small" data-act="tpause" type="button">Pause starten</button>';
      }
      html += "</div>";
    }
    html += "</section>";

    /* Woche */
    var wkey = isoWeek(now);
    var themen = (state.w && state.w[wkey]) || [];
    var themenWert = themenEntwurf && themenEntwurf.key === wkey
      ? themenEntwurf.text : themen.join(" · ");

    html += '<section class="card"><div class="card-head"><h2>Die Woche</h2>' +
      '<span class="note mono">' + fmtMin(wk.done) + " von " + fmtMin(wk.planned) +
      " geplant · " + esc(wkey.split("-W")[1]) + ". Woche</span></div>" +
      '<div class="week">';
    wk.days.forEach(function (dd, i) {
      var seal = dd.all ? "on" : dd.core ? "part" : "";
      // Der Abstand zu heute ist zugleich der Wert von view — ein Klick genügt.
      var off = Math.round((dd.date - now) / 86400000);
      var sel = off === view;
      html += '<button type="button" class="day' + (dd.today ? " today" : "") +
        (sel ? " sel" : "") + (dd.info.counts ? "" : " off") + '"' +
        ' data-act="day" data-off="' + off + '"' + (dd.future ? " disabled" : "") +
        (sel ? ' aria-current="date"' : "") +
        ' aria-label="' + esc(dd.info.plan.label) + ", " + pad(dd.date.getDate()) + "." +
        pad(dd.date.getMonth() + 1) + ". · " + dd.hit + " von " + dd.total + ' erledigt">' +
        '<span class="wd">' + WD[i] + "</span>" +
        '<span class="dt mono">' + pad(dd.date.getDate()) + "</span>" +
        '<span class="qt mono">' + (dd.future ? "·" : dd.hit + "/" + dd.total) + "</span>" +
        '<span class="seal ' + seal + '">' + (seal ? icon("check", 13) : "") + "</span></button>";
    });
    html += "</div>";

    // Schwerpunkte und Wochenziel — dieselben Schlüssel wie im Mac-Widget.
    html += '<div class="wfuss">' +
      '<label class="wf themen"><span class="eyebrow">Schwerpunkte dieser Woche</span>' +
      '<input id="themen" type="text" maxlength="200" value="' + esc(themenWert) + '" ' +
      'placeholder="zwei Themen, getrennt mit  ·  oder  ;"></label>' +
      '<label class="wf ziel"><span class="eyebrow">Wochenziel</span>' +
      '<span class="zeile"><input id="wziel" type="number" min="0" max="60" step="0.5" ' +
      'value="' + (Math.round((wk.goal / 60) * 10) / 10) + '"><span class="einheit">Stunden</span></span>' +
      '<span class="note tiny">wirkt auf die Anzeige oben und das Abzeichen ' +
      "„Wochenmeister“ — nicht auf XP oder Stufen</span></label>" +
      "</div>";

    if (themen.length) {
      html += '<div class="row" style="margin-top:10px">' + themen.map(function (t) {
        return '<span class="chip">' + esc(t) + "</span>";
      }).join("") + "</div>";
    }
    html += "</section>";

    /* Attribute */
    html += '<section class="card"><div class="card-head"><h2>Attribute</h2>' +
      '<span class="note mono">Fachpunkte ohne Serien-Bonus</span></div><div class="attrs">';
    ATTRS.forEach(function (at) {
      var ax = ev.attrXp[at.id] || 0, st = standOf(at.id, ax);
      html += '<div class="attr' + (st.open ? " ready" : "") + '">' +
        '<div class="ah"><span class="ic">' + icon(at.icon, 16) + "</span>" +
        '<span class="an">' + esc(at.nm) + "</span>" +
        '<span class="alv mono">' + st.level + "</span></div>";
      if (st.open) {
        // Lernzeit reicht — jetzt entscheidet die Prüfung, nicht die Uhr.
        html += '<button class="exbtn" data-act="exam" data-attr="' + at.id + '" type="button">' +
          icon("check", 14) + "Stufenprüfung " + st.next + "</button>";
      } else {
        html += '<div class="bar blue"><i style="width:' + st.pct + '%"></i></div>';
      }
      var fachNoten = (state.g || []).filter(function (e) { return e.fach === at.id; });
      var fachSchnitt = schnitt(fachNoten);
      var letzte = fachNoten.slice().sort(function (a, b) {
        return (a.dat || "") < (b.dat || "") ? 1 : -1;
      })[0];
      html += '<div class="ad">' + esc(at.de) + "</div>" +
        (fachSchnitt !== null
          ? '<div class="agn mono' + (fachSchnitt > 3 ? " warn" : "") + '">Schnitt ' +
            num(fachSchnitt) + " · zuletzt " + num(letzte.n) +
            (letzte.was ? " (" + esc(letzte.was) + ")" : "") + "</div>"
          : "") +
        '<div class="ax mono">' + Math.round(ax) + " XP · " + fmtMin(ev.attrMin[at.id] || 0) + "</div>" +
        '<div class="ax next">' + (st.open
          ? "Lernzeit reicht für Stufe " + st.next + " — " + huerde(st.next) + " von 5 Fragen richtig"
          : st.to
            ? "noch " + (st.to - Math.round(ax)) + " XP bis Stufe " + (st.xpLevel + 1) +
              " · ≈ " + hoursFor(st.to - Math.round(ax))
            : "höchste Stufe erreicht") + "</div></div>";
    });
    html += "</div></section>";

    /* Noten */
    html += notenKarte(now);

    /* Karriereplan */
    var states = PHASES.map(function (ph) { return phaseState(ph, ev, rank); });
    var openN = states.filter(function (x) { return x.open; }).length;
    html += '<section class="card"><div class="card-head"><h2>Karriereplan</h2>' +
      '<a class="note mono" href="' + PLAN_URL + '" target="_blank" rel="noopener">' +
      openN + " von " + PHASES.length + " freigeschaltet · Plan öffnen</a></div>" +
      '<ol class="phases">';
    PHASES.forEach(function (ph, i) {
      var st = states[i];
      html += '<li class="phase' + (st.open ? " open" : "") + '">' +
        '<div class="ph-head"><span class="ph-no mono">' + pad(i + 1) + "</span>" +
        '<span class="ph-nm">' + esc(ph.nm) + "</span>" +
        (st.open ? '<span class="ph-tag on">' + (st.past ? "abgeschlossen" : "läuft") + "</span>"
                 : st.wait
                   ? '<span class="ph-tag">' + icon("lock", 12) + "ab " + st.wait.getFullYear() + "</span>"
                   : '<span class="ph-tag">' + icon("lock", 12) + "gesperrt</span>") +
        "</div>" +
        '<div class="ph-why">' + esc(ph.why) + "</div>";
      if (st.open) {
        html += '<ul class="ph-tasks">' + ph.tasks.map(function (t) {
          return "<li>" + esc(t) + "</li>";
        }).join("") + "</ul>";
      } else if (st.wait) {
        html += '<div class="ph-need"><span class="eyebrow">Öffnet ' +
          st.wait.getFullYear() + '</span>' +
          (st.missing.length
            ? st.missing.map(function (m) {
                return '<span class="req">bis dahin ' + esc(m.nm) + "</span>";
              }).join("")
            : '<span class="req">Kommt von allein — bis dahin zählt die Phase davor</span>') +
          "</div>";
      } else {
        html += '<div class="ph-need"><span class="eyebrow">Dafür fehlt</span>' +
          st.missing.map(function (m) {
            return '<span class="req">' + esc(m.nm) +
              ' <em class="mono">du hast ' + m.have + " · noch ≈ " + hoursFor(m.xp) + "</em></span>";
          }).join("") + "</div>";
      }
      html += "</li>";
    });
    html += "</ol></section>";

    /* Abzeichen */
    var bs = badges(ev, wk), got = bs.filter(function (b) { return b.have >= b.need; }).length;
    html += '<section class="card"><div class="card-head"><h2>Abzeichen</h2>' +
      '<span class="note mono">' + got + " von " + bs.length + "</span></div>" +
      '<div class="badges">';
    bs.forEach(function (b) {
      var done = b.have >= b.need;
      html += '<div class="badge' + (done ? " got" : "") + '">' +
        '<div class="bh"><span class="ic">' + icon(b.icon, 17) + "</span>" +
        '<span class="bn">' + esc(b.nm) + "</span></div>" +
        '<div class="bd">' + esc(b.de) + "</div>" +
        '<div class="bar' + (done ? "" : " blue") + '"><i style="width:' +
        Math.min(100, Math.round((b.have / b.need) * 100)) + '%"></i></div>' +
        '<div class="bp mono">' + Math.min(b.have, b.need) + " / " + b.need + "</div></div>";
    });
    html += "</div></section>";

    /* Monat */
    var mBasis = new Date(now.getFullYear(), now.getMonth() + monatOffset, 1, 12);
    var y = mBasis.getFullYear(), mo = mBasis.getMonth();
    var lead = (new Date(y, mo, 1).getDay() + 6) % 7, len = new Date(y, mo + 1, 0).getDate();
    // Zahlen nur für diesen Monat, nicht für den ganzen Verlauf
    var mStat = { counted: 0, core: 0, all: 0, mins: 0, off: 0 };
    for (var mt = 1; mt <= len; mt++) {
      var r = ev.perDay[ymd(new Date(y, mo, mt, 12))];
      if (!r) continue;
      if (!r.counts) { mStat.off++; continue; }
      mStat.counted++; mStat.mins += r.mins || 0;
      if (r.core) mStat.core++;
      if (r.all) mStat.all++;
    }
    html += '<section class="card"><div class="card-head"><h2>' + MONTHS[mo] + " " + y + "</h2>" +
      '<div class="row">' +
      '<span class="note mono">' + mStat.core + " von " + mStat.counted + " Tagen mit Kern</span>" +
      '<button class="btn small" data-act="mprev" type="button" aria-label="Monat zurück">‹</button>' +
      '<button class="btn small" data-act="mnext" type="button" aria-label="Monat vor"' +
      (monatOffset >= 0 ? " disabled" : "") + ">›</button>" +
      "</div></div>" +
      '<div class="monthrow"><div class="monthwrap"><div class="month">';
    WD.forEach(function (w) { html += '<span class="lbl">' + w + "</span>"; });
    for (var i = 0; i < lead; i++) html += '<span class="cell blank"></span>';
    for (var dnum = 1; dnum <= len; dnum++) {
      var dt = new Date(y, mo, dnum, 12), k = ymd(dt), rec = ev.perDay[k];
      var kuenftig = dt > now;
      var off = Math.round((dt - now) / 86400000);
      var cls = "cell";
      if (kuenftig || !rec) cls += "";
      else if (!rec.counts) cls += " skip";
      else if (rec.ratio >= 1) cls += " s4";
      else if (rec.ratio >= 0.7) cls += " s3";
      else if (rec.ratio >= 0.4) cls += " s2";
      else if (rec.ratio > 0) cls += " s1";
      if (k === ymd(now)) cls += " today";
      if (off === view) cls += " sel";
      if (state.n[k]) cls += " memo";
      // Jeder vergangene Tag ist von hier aus einen Klick zum Nachtragen weit.
      html += '<button type="button" class="' + cls + '" data-act="day" data-off="' + off + '"' +
        (kuenftig ? " disabled" : "") +
        ' title="' + k + (state.n[k] ? " · " + esc(state.n[k]) : "") + '">' + dnum + "</button>";
    }
    html += "</div></div>";
    html += '<dl class="mstats">' +
      '<div><dt>Lernzeit</dt><dd class="mono">' + fmtMin(mStat.mins) + "</dd></div>" +
      '<div><dt>Volle Tage</dt><dd class="mono">' + mStat.all + "</dd></div>" +
      '<div><dt>Ohne Wertung</dt><dd class="mono">' + mStat.off + "</dd></div>" +
      '<div><dt>Bester Lauf</dt><dd class="mono">' + ev.best + " Tage</dd></div>" +
      "</dl></div>";
    html += '<div class="legend"><span>wenig</span>' +
      '<i style="background:var(--heat-0)"></i><i style="background:var(--heat-1)"></i>' +
      '<i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i>' +
      '<i style="background:var(--heat-4)"></i><span>alles</span>' +
      '<i class="cell skip" style="margin-left:10px"></i><span>Feiertag, frei oder krank — zählt nicht</span>' +
      '<i class="cell memo" style="margin-left:10px"></i><span>Notiz vorhanden</span>' +
      "</div></section>";

    /* Daten */
    html += '<section class="card"><div class="card-head"><h2>Austausch mit dem Widget</h2>' +
      '<span class="note mono" id="savestate">' + esc(statusTxt) + "</span></div>" +
      '<p class="note">Dasselbe Format wie <code class="mono">~/.lernplan-widget.json</code>. ' +
      "Von dort einfügen und einlesen, oder hier kopieren und dort ablegen.</p>" +
      '<textarea id="io" spellcheck="false" aria-label="Zustand als JSON">' +
      esc(ioEntwurf !== null ? ioEntwurf
          : JSON.stringify({ v: 4, d: state.d, f: state.f, n: state.n, w: state.w,
                             q: state.q, g: state.g, t: state.t,
                             zn: state.zn, zw: state.zw })) + "</textarea>" +
      '<div class="row" style="margin-top:10px">' +
      '<button class="btn" data-act="copy" type="button">' + icon("cards") + "Kopieren</button>" +
      '<button class="btn" data-act="merge" type="button">' + icon("check") + "Zusammenführen</button>" +
      '<button class="btn ghost" data-act="import" type="button">Ersetzen</button>' +
      '<span class="note" id="iomsg"></span></div>' +
      '<p class="note tiny">Zusammenführen behält beides: je Tag die Vereinigung der ' +
      "Häkchen, Noten kommen dazu. Ersetzen wirft den hiesigen Stand weg — beides " +
      "lässt sich eine Minute lang zurücknehmen.</p></section>";

    html += "</div>";

    html += '<footer><span>Feiertage Baden-Württemberg aus der Osterformel · ' +
      "Ferien bis " + PLAN.vacations[PLAN.vacations.length - 1][1].split("-").reverse().join(".") + "</span>" +
      "<span>Punkte je Minute: Deep Work ×1,6 · Anki ×1,2 · Wiederholen ×1,0 · Routine ×0,8 · Lesen ×0,7 — Kern +50, voller Tag +100</span></footer>";

    document.getElementById("root").innerHTML = html;
    fokusSetzen(fok);
  }

  /* ---- Bedienung -------------------------------------------------------- */
  function toggleBlock(id) {
    var info = dayInfo(shownDate(), state.f);
    var list = (state.d[info.key] || []).slice();
    var i = list.indexOf(id);
    var b = (info.plan.blocks || []).filter(function (x) { return x.id === id; })[0];
    if (i >= 0) list.splice(i, 1); else list.push(id);
    if (list.length) state.d[info.key] = list; else delete state.d[info.key];
    if (i < 0 && b) lastFloat = { id: id, xp: blockXp(b) };
    save(); render(); showFloat();
  }
  function showFloat() {
    if (!lastFloat) return;
    var row = document.querySelector('.quest[data-id="' + lastFloat.id + '"]');
    if (row) {
      var s = document.createElement("span");
      s.className = "float mono";
      s.textContent = "+" + lastFloat.xp + " XP";
      row.appendChild(s);
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 950);
    }
    lastFloat = null;
  }
  function cycleMark() {
    var key = dayInfo(shownDate(), state.f).key;
    var cur = state.f[key];
    merke(cur === "frei" ? "krank gesetzt" : cur ? "Markierung entfernt" : "frei gesetzt");
    if (!cur) state.f[key] = "frei";
    else if (cur === "frei") state.f[key] = "krank";
    else delete state.f[key];
    save(); render();
  }

  /*  Morgenroutine, Anki und Lesen in einem Griff — das ist die Schwelle,
      an der ein Tag noch zählt.                                             */
  function kernStempeln() {
    var info = dayInfo(shownDate(), state.f);
    var need = coreIds(info.plan);
    if (!need.length) return;
    var list = (state.d[info.key] || []).slice(), neu = 0;
    need.forEach(function (id) { if (list.indexOf(id) < 0) { list.push(id); neu++; } });
    if (!neu) return;
    merke("Kern abgehakt");
    state.d[info.key] = list;
    save(); render();
    sag("Kern abgehakt — " + neu + (neu === 1 ? " Block" : " Blöcke") + " dazu.");
  }

  function notizSetzen(txt) {
    var key = dayInfo(shownDate(), state.f).key;
    var alt = state.n[key] || "";
    var neu = String(txt || "").trim().slice(0, 280);
    if (alt === neu) { notizEntwurf = null; return; }
    merke("Notiz geändert");
    if (neu) state.n[key] = neu; else delete state.n[key];
    notizEntwurf = null;
    save(); render();
  }
  function themenSetzen(txt) {
    var key = isoWeek(today());
    var liste = String(txt || "").split(/[·;|,]/).map(function (x) { return x.trim(); })
                 .filter(Boolean).map(function (x) { return x.slice(0, 90); }).slice(0, 3);
    var alt = (state.w[key] || []).join(" · ");
    if (alt === liste.join(" · ")) { themenEntwurf = null; return; }
    merke("Schwerpunkte geändert");
    if (liste.length) state.w[key] = liste; else delete state.w[key];
    themenEntwurf = null;
    save(); render();
  }

  /*  Zusammenführen statt überschreiben. Häkchen werden vereinigt, bestandene
      Stufen auf den höheren Wert gezogen, Noten ergänzt. Wo beide Seiten etwas
      haben, das sich nicht vereinigen lässt — Markierungen, Notizen,
      Schwerpunkte —, behält der hiesige Stand recht; der Fremdstand füllt nur
      die Lücken. Ersetzen bleibt als zweiter Knopf daneben.                  */
  function zusammenfuehren(fremd) {
    Object.keys(fremd.d).forEach(function (k) {
      var mein = state.d[k] || [], zus = mein.slice();
      fremd.d[k].forEach(function (id) { if (zus.indexOf(id) < 0) zus.push(id); });
      if (zus.length) state.d[k] = zus;
    });
    Object.keys(fremd.f).forEach(function (k) { if (!state.f[k]) state.f[k] = fremd.f[k]; });
    Object.keys(fremd.n).forEach(function (k) { if (!state.n[k]) state.n[k] = fremd.n[k]; });
    Object.keys(fremd.w).forEach(function (k) { if (!state.w[k]) state.w[k] = fremd.w[k]; });
    Object.keys(fremd.q).forEach(function (k) {
      state.q[k] = Math.max(Number(state.q[k]) || 1, Number(fremd.q[k]) || 1);
    });
    var habe = {};
    (state.g || []).forEach(function (e) { habe[e.id] = true; });
    (fremd.g || []).forEach(function (e) { if (!habe[e.id]) state.g.push(e); });
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "exam") { startExam(el.getAttribute("data-attr")); return; }
    if (act === "examPick") {
      var f = exam.fragen[exam.i], i = Number(el.getAttribute("data-i"));
      antwort(i === f.k, i); return;
    }
    if (act === "examNum") {
      var fn = exam.fragen[exam.i];
      var v = Number(document.getElementById("exNum").value);
      antwort(isFinite(v) && Math.abs(v - fn.a) <= (fn.tol || 0), null); return;
    }
    if (act === "examNext") { exam.i++; exam.beantwortet = false; exam.gewaehlt = null; zeigeExam(); return; }
    if (act === "examRetry") {
      exam = { attr: exam.attr, ziel: exam.ziel, fragen: zieheFragen(exam.attr, exam.ziel),
               i: 0, richtig: 0, beantwortet: false, gewaehlt: null };
      zeigeExam(); return;
    }
    if (act === "examClose") {
      var dlg = document.getElementById("examDlg");
      if (dlg) { try { dlg.close(); } catch (e) { dlg.removeAttribute("open"); } }
      exam = null; render();
      // Was während der Prüfung liegen blieb, geht jetzt raus.
      if (nachholen) { nachholen = false; save(); }
      return;
    }
    if (act === "undo") { rueckNehmen(); return; }
    if (act === "weckerAus") { weckerZurueck(); return; }
    if (act === "tstart") {
      var tb = (dayInfo(shownDate(), state.f).plan.blocks || [])
        .filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      if (tb) timerStart(tb, dayInfo(shownDate(), state.f).key);
      return;
    }
    if (act === "tstop") { timerStop(); return; }
    if (act === "tplus") { timerPlus(10); return; }
    if (act === "tpause") { pauseStart(); return; }
    if (act === "mprev") { monatOffset -= 1; render(); return; }
    if (act === "mnext") { if (monatOffset < 0) { monatOffset += 1; render(); } return; }
    if (act === "kern") { kernStempeln(); return; }
    if (act === "toggle") toggleBlock(el.getAttribute("data-id"));
    else if (act === "prev") { setView(view - 1); render(); }
    else if (act === "next") { if (view < 0) { setView(view + 1); render(); } }
    else if (act === "today") { setView(0); render(); }
    else if (act === "day") { setView(Number(el.getAttribute("data-off")) || 0); render(); }
    else if (act === "gadd") noteEintragen();
    else if (act === "gdel") {
      var gi = el.getAttribute("data-id");
      var weg = (state.g || []).filter(function (x) { return x.id === gi; })[0];
      merke("Note gelöscht" + (weg && weg.was ? ": " + weg.was : ""));
      state.g = (state.g || []).filter(function (x) { return x.id !== gi; });
      save(); render();
    }
    else if (act === "mark") cycleMark();
    else if (act === "theme") {
      var root = document.documentElement;
      var isDark = root.getAttribute("data-theme") === "dark" ||
        (!root.getAttribute("data-theme") &&
         window.matchMedia("(prefers-color-scheme: dark)").matches);
      root.setAttribute("data-theme", isDark ? "light" : "dark");
    } else if (act === "copy") {
      var ta = document.getElementById("io");
      ta.select();
      try { document.execCommand("copy"); msg("kopiert", true); }
      catch (err) { msg("Kopieren ging nicht — von Hand markieren", false); }
    } else if (act === "import" || act === "merge") {
      try {
        var roh = JSON.parse(document.getElementById("io").value);
        var incoming = normalize(roh);
        merke(act === "merge" ? "zusammengeführt" : "Stand ersetzt");
        if (act === "merge") {
          zusammenfuehren(incoming);
        } else {
          state.d = incoming.d; state.f = incoming.f; state.n = incoming.n;
          state.w = incoming.w; state.q = incoming.q;
          // Das Mac-Widget kennt weder Noten noch Zielnote. Käme sein JSON hier
          // an, würden beide sonst kommentarlos verschwinden.
          if (Object.prototype.hasOwnProperty.call(roh, "g")) state.g = incoming.g;
          if (Object.prototype.hasOwnProperty.call(roh, "zn")) state.zn = incoming.zn;
          if (Object.prototype.hasOwnProperty.call(roh, "zw")) state.zw = incoming.zw;
        }
        ioEntwurf = null;
        save(); render();
        msg(act === "merge" ? "zusammengeführt" : "ersetzt", true);
      } catch (err) { msg("Das ist kein gültiges JSON", false); }
    }
  });
  /*  Das Formular wird bei jedem render() neu gebaut. Damit Getipptes einen
      Klick auf ein Häkchen überlebt, liegen die Werte in gForm und werden von
      dort wieder eingesetzt.                                                 */
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === "gNote") { gForm.n = t.value; gMsg = null; gTipp(); }
    else if (t.id === "gPkt") { gForm.p = t.value; gMsg = null; gTipp(); }
    else if (t.id === "gWas") gForm.was = t.value;
    else if (t.id === "gDat") gForm.dat = t.value;
    else if (t.id === "notiz") {
      notizEntwurf = { key: dayInfo(shownDate(), state.f).key, text: t.value };
    } else if (t.id === "themen") {
      themenEntwurf = { key: isoWeek(today()), text: t.value };
    } else if (t.id === "io") ioEntwurf = t.value;
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === "gFach") { gForm.fach = t.value; gMsg = null; gTipp(); }
    else if (t.id === "gGew") gForm.gew = t.value;
    else if (t.id === "gZiel") {
      var z = Number(t.value);
      state.zn = isFinite(z) && z >= 1 && z <= 6 ? Math.round(z * 10) / 10 : 1.9;
      save(); render();
    }
    // Notiz und Schwerpunkte werden beim Verlassen des Feldes gesichert, nicht
    // bei jedem Buchstaben — sonst veröffentlichte die Seite im Tippen.
    else if (t.id === "notiz") notizSetzen(t.value);
    else if (t.id === "themen") themenSetzen(t.value);
    else if (t.id === "wziel") {
      var std = Number(t.value);
      state.zw = isFinite(std) && std >= 0 && std <= 60 ? Math.round(std * 60) : 900;
      save(); render();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var t = e.target;
    if (!t || !t.id) return;
    if (["gWas", "gNote", "gPkt", "gDat"].indexOf(t.id) >= 0) { e.preventDefault(); noteEintragen(); }
    else if (t.id === "notiz") { e.preventDefault(); notizSetzen(t.value); }
    else if (t.id === "themen") { e.preventDefault(); themenSetzen(t.value); }
  });

  /*  Am Rechner blättern die Pfeiltasten durch die Tage — aber nur, wenn
      gerade nicht in ein Feld getippt wird.                                 */
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
    if (document.getElementById("examDlg") && document.getElementById("examDlg").open) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); setView(view - 1); render(); }
    else if (e.key === "ArrowRight" && view < 0) { e.preventDefault(); setView(view + 1); render(); }
  });
  /*  Nur die eine Zeile neu schreiben — ein render() würde den Fokus aus dem
      Feld reissen, in dem gerade getippt wird.                               */
  function gTipp() {
    var el = document.getElementById("gtip");
    if (!el) return;
    el.textContent = gHinweis();
    el.className = "gtip note";
  }

  function msg(txt, good) {
    var el = document.getElementById("iomsg");
    if (!el) return;
    el.textContent = txt;
    el.className = "note " + (good ? "ok" : "bad");
  }

  /* ---- Start ------------------------------------------------------------ */
  load();
  render();
  // Ein Takt für Timer, Wecker und den Jetzt-Marker. Er schreibt nichts.
  setInterval(takt, 1000);
  // Im Hintergrund bremst der Browser den Takt. Beim Zurückkommen deshalb
  // sofort nachsehen, statt bis zur nächsten Sekunde zu warten.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) takt();
  });

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (api) {
      if (!api) return;
      artifactApi = api; saveMode = "geteilt";
      setStatus("gesichert");
    })["catch"](function () { /* bleibt lokal */ });
  }
})();
</script>
